<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b4cca">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AAA Lab">
<title>AAA Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: app shell with sticky top bar, side rail on wide screens, bottom tab bar on phones; content column max 980px */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --surface-2:#eceef5; --line:#dde0ea; --fg:#151826; --muted:#5d6377; --faint:#8b90a3;
  --accent:#3b4cca; --accent-ink:#ffffff; --accent-soft:#e4e7fb;
  --psych:#8a3ffc; --psych-soft:#efe6ff; --maths:#0f8a7e; --maths-soft:#dcf3f0; --econ:#c2610c; --econ-soft:#fbead9;
  --good:#1d8a4a; --good-soft:#dcf2e4; --warn:#b7791f; --warn-soft:#fbefd6; --bad:#c23b3b; --bad-soft:#f9e0e0;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 16px rgba(20,24,40,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1017; --surface:#171a24; --surface-2:#20243200; --line:#2a2f40; --fg:#eceef6; --muted:#a3a8bd; --faint:#767c93;
  --accent:#8a97ff; --accent-ink:#0e1017; --accent-soft:#232a52;
  --psych:#b98cff; --psych-soft:#2c2142; --maths:#4fd1c0; --maths-soft:#123532; --econ:#f2a25c; --econ-soft:#3a2716;
  --good:#5dd38c; --good-soft:#15331f; --warn:#f0c060; --warn-soft:#3a2f14; --bad:#ff7d7d; --bad-soft:#3d1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1017; --surface:#171a24; --surface-2:#202432; --line:#2a2f40; --fg:#eceef6; --muted:#a3a8bd; --faint:#767c93;
  --accent:#8a97ff; --accent-ink:#0e1017; --accent-soft:#232a52;
  --psych:#b98cff; --psych-soft:#2c2142; --maths:#4fd1c0; --maths-soft:#123532; --econ:#f2a25c; --econ-soft:#3a2716;
  --good:#5dd38c; --good-soft:#15331f; --warn:#f0c060; --warn-soft:#3a2f14; --bad:#ff7d7d; --bad-soft:#3d1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface-2:#202432}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--fg);white-space:nowrap}
.brand-mark{display:inline-flex;gap:2px}
.brand-mark i{display:block;width:9px;height:20px;border-radius:3px}
.brand-mark i:nth-child(1){background:var(--psych)} .brand-mark i:nth-child(2){background:var(--maths);height:26px;margin-top:-6px} .brand-mark i:nth-child(3){background:var(--econ)}
.top-sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:.78rem;font-weight:600;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--good)} .chip.warn .dot{background:var(--warn)}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:4px}
.nav-a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.93rem;border:0;background:none;text-align:left}
.nav-a svg{width:19px;height:19px;flex:none}
.nav-a:hover{background:var(--surface-2);color:var(--fg)}
.nav-a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail .rail-foot{margin-top:18px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.main{min-width:0}
.pp-grid{display:grid;gap:6px;align-items:stretch}
.pp-cell{min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:2px;font:inherit;color:inherit}
.pp-cell:hover{border-color:var(--sc,var(--accent))}
.pp-cell.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pp-cell .pill{font-size:.72rem;padding:2px 6px}
.pp-trend{display:flex;align-items:flex-end;gap:4px;height:38px;margin-top:4px}
.pp-trend i{flex:1;max-width:18px;border-radius:3px 3px 0 0;background:var(--good)}
.pp-trend i.warn{background:var(--warn)}.pp-trend i.bad{background:var(--bad)}
.pp-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;line-height:1.5}
.pp-clock{font-size:clamp(2.6rem,12vw,4.4rem);font-weight:700;letter-spacing:-.02em}
.tabbar{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);padding-block:16px 96px}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar .nav-a{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:.66rem;border-radius:8px;align-items:center;text-align:center}
  .tabbar .nav-a[aria-current="page"]{background:none}
  .hide-sm{display:none!important}
}

/* primitives */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.pad-lg{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;text-decoration:none;color:var(--fg);min-height:42px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.84rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap}
.s-psych{--sc:var(--psych);--ss:var(--psych-soft)} .s-maths{--sc:var(--maths);--ss:var(--maths-soft)} .s-econ{--sc:var(--econ);--ss:var(--econ-soft)}
.pill.subj{background:var(--ss);color:var(--sc)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--sc,var(--accent));transition:width .4s}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:120px;line-height:1.55}
.hr{height:1px;background:var(--line);margin:4px 0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:11px;font-weight:600;font-size:.9rem;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:821px){.toast{bottom:28px}}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.count-big{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,9vw,4.4rem);line-height:.95;letter-spacing:-.03em}
.timeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tl{flex:none;min-width:92px;padding:9px 10px;border-radius:11px;background:var(--ss);border:1px solid transparent}
.tl.past{opacity:.45}
.tl.next{border-color:var(--sc)}
.tl .d{font-family:var(--f-mono);font-size:.76rem;color:var(--sc);font-weight:700}
.tl .n{font-weight:700;font-size:.82rem}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--ss,var(--accent-soft));color:var(--sc,var(--accent));flex:none}
.task .ic svg{width:18px;height:18px}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-weight:600;font-size:.94rem}
.task.done .tx b{text-decoration:line-through;color:var(--muted)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.task.done .check{background:var(--good);border-color:var(--good);color:#fff}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.05}
.subj-card{border-top:4px solid var(--sc)}
.grade{font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.grade .arrow{color:var(--faint);font-weight:500;margin:0 6px}

/* library */
.topic-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 70px;gap:14px;align-items:center;padding:13px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.topic-row:hover{border-color:var(--sc)}
.topic-row .nm{font-weight:650;font-weight:600}
@media (max-width:560px){.topic-row{grid-template-columns:minmax(0,1fr) 70px}.topic-row .tb{display:none}}
.paper-h{display:flex;align-items:baseline;gap:10px;margin:8px 2px 2px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:96px}
.mode:hover{border-color:var(--sc,var(--accent));transform:translateY(-1px)}
.mode svg{width:22px;height:22px;color:var(--sc,var(--accent))}
.mode b{font-size:.95rem}
.mode span{font-size:.78rem;color:var(--muted);line-height:1.3}
.term-list{display:flex;flex-direction:column;gap:8px}
.term{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) auto;gap:16px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);align-items:start}
.term .q{font-weight:600}
.term .a{color:var(--muted);font-size:.9rem}
@media (max-width:640px){.term{grid-template-columns:minmax(0,1fr) auto}.term .a{grid-column:1/-1;grid-row:2}}
.star{border:0;background:none;color:var(--faint);padding:2px;line-height:0}
.star[aria-pressed="true"]{color:var(--warn)}
.star svg{width:20px;height:20px}

/* study */
.study-top{display:flex;align-items:center;gap:12px}
.progress-line{flex:1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--sc,var(--accent));transition:width .3s}
.flash{perspective:1400px;width:100%;max-width:760px;margin:0 auto}
.flash-in{position:relative;min-height:min(56vh,420px);transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:24px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .body{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
.face.front .body{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,3.6vw,1.9rem);line-height:1.25}
.face.back .body{font-size:clamp(.98rem,2.4vw,1.1rem);line-height:1.6;text-align:left;justify-content:flex-start;align-items:flex-start}
@media (prefers-reduced-motion:reduce){.flash-in{transition:none}}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:760px;margin:0 auto;width:100%}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.gbtn small{font-weight:500;color:var(--muted);font-size:.72rem}
.gbtn.again{color:var(--bad)} .gbtn.hard{color:var(--warn)} .gbtn.goodb{color:var(--good)} .gbtn.easy{color:var(--accent)}
.gbtn:hover{background:var(--surface-2)}
.kbd{font-family:var(--f-mono);font-size:.7rem;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--faint)}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);line-height:1.45;font-size:.93rem}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .k{font-family:var(--f-mono);font-size:.75rem;color:var(--faint);margin-right:8px}
.qbox{max-width:760px;margin:0 auto;width:100%}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(1.2rem,3vw,1.55rem);line-height:1.3}
.kw{display:inline-block;padding:1px 8px;border-radius:7px;margin:2px;font-size:.82rem;font-weight:600}
.kw.hit{background:var(--good-soft);color:var(--good)} .kw.miss{background:var(--surface-2);color:var(--muted)}
.feedback{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.feedback.ok{background:var(--good-soft);border-color:transparent}
.feedback.no{background:var(--bad-soft);border-color:transparent}
.feedback.warn{background:var(--warn-soft);border-color:transparent}
#syncChip{min-width:0;flex-shrink:1;overflow:hidden}#syncTxt{overflow:hidden;text-overflow:ellipsis}
body.setup .tabbar,body.setup .rail{display:none!important}
html.ts-l{font-size:112.5%}html.ts-l body{font-size:17px}html.ts-xl{font-size:125%}html.ts-xl body{font-size:19px}
.say{border:0;background:var(--surface-2);color:var(--muted);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;cursor:pointer}
.say svg{width:17px;height:17px}.say:active{transform:scale(.94)}
.conf{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:1px;margin-right:6px;background:var(--line)}
.conf.r{background:var(--bad)}.conf.a{background:var(--warn)}.conf.g{background:var(--good)}
.confbtn[aria-pressed="true"].r{background:var(--bad-soft);color:var(--bad)}.confbtn[aria-pressed="true"].a{background:var(--warn-soft);color:var(--warn)}.confbtn[aria-pressed="true"].g{background:var(--good-soft);color:var(--good)}
.notes dt{font-weight:700;margin-top:12px}.notes dd{margin:2px 0 0 0;color:var(--fg)}
@media print{.top,.tabbar,.rail,.study-top,.noprint{display:none!important}.layout{display:block;padding:0}body{background:#fff;color:#000}.card{box-shadow:none;border:1px solid #ccc}}
body.setup .layout{grid-template-columns:minmax(0,1fr)}
.match-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.match-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{min-height:104px;padding:10px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-size:.82rem;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.tile.term-t{font-weight:700;font-size:.9rem}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.tile.gone{visibility:hidden}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.result-big{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1}
.ms-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.ms-item:first-child{border-top:0}
.ms-item input{width:20px;height:20px;margin-top:2px;accent-color:var(--good);flex:none}
.level{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.86rem;margin-top:6px}
.level[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ai-out{white-space:pre-wrap;line-height:1.6}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.88rem}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.heat i{border-radius:3px;background:var(--surface-2)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 80%,var(--surface-2))}
.heat i[data-l="4"]{background:var(--accent)}
.phase{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0}
.phase.now .ph-n{color:var(--accent)}
@media (max-width:560px){.phase{grid-template-columns:minmax(0,1fr);gap:4px}}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.hidden-sm{}

<script>
// Maths question generators. Each returns {q, ans, dp, sol, unit}
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const nz = (a, b) => { let x = 0; while (x === 0) x = R(a, b); return x; };
const sgn = (n, first) => (n < 0 ? (first ? '−' : ' − ') + Math.abs(n) : (first ? '' : ' + ') + n);
const term = (c, v, first) => {
  if (c === 0) return '';
  const a = Math.abs(c);
  const coef = a === 1 && v ? '' : String(a);
  const s = c < 0 ? (first ? '−' : ' − ') : (first ? '' : ' + ');
  return s + coef + v;
};
const poly = (terms) => { let out = ''; terms.forEach(([c, v]) => { const t = term(c, v, out === ''); out += t; }); return out || '0'; };
const comb = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); };
function erf(x) { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; }
const Phi = (z) => 0.5 * (1 + erf(z / Math.SQRT2));
const fmt = (x, dp) => Number(x.toFixed(dp)).toString();
const G = 9.8;

const GEN = {
  'm-diff': [
    () => { const a = R(2, 5), b = R(-4, 5), n = R(3, 5), x = R(0, 2); const ans = n * a * Math.pow(a * x + b, n - 1);
      return { q: `Use the chain rule to find the gradient of y = (${a}x${sgn(b)})${['', '', '', '³', '⁴', '⁵'][n]} at x = ${x}.`, ans, dp: 0, sol: `dy/dx = ${n}(${a})(${a}x${sgn(b)})${['', '', '', '²', '³', '⁴'][n]} = ${n * a}(${a * x + b})${['', '', '', '²', '³', '⁴'][n]} = ${ans}.` }; },
    () => { const c = R(1, 9), x = R(1, 4); const ans = 2 * x / (x * x + c);
      return { q: `Find the gradient of y = ln(x² + ${c}) at x = ${x}, to 3 d.p.`, ans, dp: 3, sol: `dy/dx = 2x/(x² + ${c}) = ${2 * x}/${x * x + c} = ${fmt(ans, 5)}.` }; },
    () => { const a = nz(-2, 3), b = R(-5, 5), x = nz(-2, 3); const m = 2 * a * x + b; if (m === 0) return GEN['m-diff'][0](); const ans = -1 / m;
      return { q: `Find the gradient of the normal to y = ${poly([[a, 'x²'], [b, 'x']])} at x = ${x}, to 3 d.p. if needed.`, ans, dp: 3, sol: `dy/dx = ${poly([[2 * a, 'x'], [b, '']])} = ${m} at x = ${x}. Normal gradient = −1/${m} = ${fmt(ans, 4)}.` }; },
    () => { const a = nz(-3, 4), b = R(-6, 6), c = R(-9, 9), k = nz(-3, 3);
      const ans = 3 * a * k * k + 2 * b * k + c;
      return { q: `Find the gradient of y = ${poly([[a, 'x³'], [b, 'x²'], [c, 'x']])} at x = ${k}.`, ans, dp: 0,
        sol: `dy/dx = ${poly([[3 * a, 'x²'], [2 * b, 'x'], [c, '']])}. At x = ${k}: ${3 * a}(${k})² ${sgn(2 * b * k)} ${sgn(c)} = ${ans}.` }; },
    () => { const a = nz(-4, 5), b = R(-12, 12), c = R(-9, 9); const ans = -b / (2 * a);
      return { q: `Find the x-coordinate of the stationary point of y = ${poly([[a, 'x²'], [b, 'x'], [c, '']])}. Give your answer to 2 d.p. if needed.`, ans, dp: 2,
        sol: `dy/dx = ${poly([[2 * a, 'x'], [b, '']])} = 0, so x = ${-b}/${2 * a} = ${fmt(ans, 4)}.` }; },
    () => { const n = R(2, 4), k = R(1, 2); const ans = (n * Math.pow(k, n - 1) + Math.pow(k, n)) * Math.exp(k);
      return { q: `Use the product rule to find the gradient of y = x${n === 2 ? '²' : n === 3 ? '³' : '⁴'}eˣ at x = ${k}. Give your answer to 3 d.p.`, ans, dp: 3,
        sol: `dy/dx = ${n}x${n - 1 === 1 ? '' : n - 1 === 2 ? '²' : '³'}eˣ + x${n === 2 ? '²' : n === 3 ? '³' : '⁴'}eˣ. At x = ${k}: (${n * Math.pow(k, n - 1)} + ${Math.pow(k, n)})e${k === 1 ? '' : '²'} = ${fmt(ans, 4)}.` }; },
    () => { const a = R(2, 5), b = R(1, 6), n = R(3, 5); const x = R(0, 2); const ans = n * a * Math.pow(a * x + b, n - 1);
      return { q: `Use the chain rule to find dy/dx when x = ${x}, for y = (${a}x + ${b})^${n}.`, ans, dp: 0,
        sol: `dy/dx = ${n} × ${a}(${a}x + ${b})^${n - 1}. At x = ${x}: ${n * a} × ${a * x + b}^${n - 1} = ${ans}.` }; },
  ],
  'm-int': [
    () => { const p = R(-3, 4), q = R(-5, 5), r = R(-6, 6), a = R(-1, 1), b = a + R(1, 3);
      const F = (x) => p * x ** 3 / 3 + q * x * x / 2 + r * x; const ans = F(b) - F(a);
      return { q: `Evaluate ∫ from ${a} to ${b} of (${poly([[p, 'x²'], [q, 'x'], [r, '']])}) dx. Give your answer to 3 d.p. if needed.`, ans, dp: 3,
        sol: `Integral = [${p}x³/3 ${sgn(q)}x²/2 ${sgn(r)}x] from ${a} to ${b} = ${fmt(F(b), 4)} − (${fmt(F(a), 4)}) = ${fmt(ans, 4)}.` }; },
    () => { const k = R(2, 9), b = R(2, 6); const ans = k * Math.log(b);
      return { q: `Find the exact value of ∫ from 1 to ${b} of ${k}/x dx, then give it to 3 d.p.`, ans, dp: 3,
        sol: `∫ ${k}/x dx = ${k} ln x. From 1 to ${b}: ${k} ln ${b} − ${k} ln 1 = ${k} ln ${b} ≈ ${fmt(ans, 4)}.` }; },
    () => { const k = R(2, 4), m = R(1, 3); const ans = (Math.exp(k * m) - 1) / k;
      return { q: `Evaluate ∫ from 0 to ${m} of e^(${k}x) dx to 3 d.p.`, ans, dp: 3,
        sol: `∫ e^(${k}x) dx = (1/${k})e^(${k}x). From 0 to ${m}: (e^${k * m} − 1)/${k} ≈ ${fmt(ans, 4)}.` }; },
  ],
  'm-seq': [
    () => { const a = R(-5, 12), d = nz(-4, 6), n = R(10, 40); const ans = n / 2 * (2 * a + (n - 1) * d);
      return { q: `An arithmetic series has first term ${a} and common difference ${d}. Find the sum of the first ${n} terms.`, ans, dp: 0,
        sol: `Sₙ = n/2 (2a + (n − 1)d) = ${n}/2 × (${2 * a} + ${(n - 1) * d}) = ${ans}.` }; },
    () => { const a = R(4, 60); const [num, den] = pick([[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [2, 5], [-1, 2], [-1, 3]]); const r = num / den; const ans = a / (1 - r);
      return { q: `A geometric series has first term ${a} and common ratio ${num}/${den}. Find the sum to infinity (2 d.p. if needed).`, ans, dp: 2,
        sol: `|r| < 1, so S∞ = a/(1 − r) = ${a}/(1 − (${num}/${den})) = ${fmt(ans, 4)}.` }; },
    () => { const a = R(1, 3), b = nz(-3, 4), n = R(4, 7), k = R(2, 3); const ans = comb(n, k) * Math.pow(a, n - k) * Math.pow(b, k);
      return { q: `Find the coefficient of x${k === 2 ? '²' : '³'} in the expansion of (${a} ${b < 0 ? '−' : '+'} ${Math.abs(b)}x)^${n}.`, ans, dp: 0,
        sol: `Term = ${n}C${k} × ${a}^${n - k} × (${b}x)^${k} = ${comb(n, k)} × ${Math.pow(a, n - k)} × ${Math.pow(b, k)} = ${ans}.` }; },
    () => { const a = R(2, 9), r = pick([2, 3, 1.5, 0.5]), n = R(5, 9); const ans = a * (1 - Math.pow(r, n)) / (1 - r);
      return { q: `Find the sum of the first ${n} terms of a geometric series with first term ${a} and common ratio ${r} (2 d.p. if needed).`, ans, dp: 2,
        sol: `Sₙ = a(1 − rⁿ)/(1 − r) = ${a}(1 − ${r}^${n})/(1 − ${r}) = ${fmt(ans, 4)}.` }; },
  ],
  'm-exp': [
    () => { const a = pick([2, 3]), p = pick([1, a, a * a]), q = pick([a * a * a, a * a]); const xs = [p, q].map(v => Math.round(Math.log(v) / Math.log(a))); const ans = Math.max(...xs);
      return { q: `Solve ${a}²ˣ − ${p + q}(${a}ˣ) + ${p * q} = 0. Give the larger value of x.`, ans, dp: 0, sol: `Let y = ${a}ˣ: y² − ${p + q}y + ${p * q} = 0, so (y − ${p})(y − ${q}) = 0. ${a}ˣ = ${p} gives x = ${xs[0]}; ${a}ˣ = ${q} gives x = ${xs[1]}. Larger: ${ans}.` }; },
    () => { const b = pick([2, 3]), n = pick([1, 2]), k = R(1, 4); const c = k * (Math.pow(b, n) - 1); const ans = k;
      return { q: `Solve log${b === 2 ? '₂' : '₃'}(x + ${c}) − log${b === 2 ? '₂' : '₃'} x = ${n}.`, ans, dp: 2, sol: `log((x + ${c})/x) = ${n}, so (x + ${c})/x = ${Math.pow(b, n)}, x + ${c} = ${Math.pow(b, n)}x, x = ${c}/${Math.pow(b, n) - 1} = ${ans}.` }; },
    () => { const k = pick([0.02, 0.05, 0.08, 0.1, 0.15, 0.2]); const ans = Math.log(2) / k;
      return { q: `A substance decays according to m = m₀e^(−${k}t). Find its half-life (the value of t when m = m₀/2), to 2 d.p.`, ans, dp: 2, sol: `½ = e^(−${k}t), so −${k}t = ln ½, t = ln 2 / ${k} = ${fmt(ans, 4)}.` }; },
    () => { const a = pick([2, 3, 5, 7]), b = R(10, 200); const ans = Math.log(b) / Math.log(a);
      return { q: `Solve ${a}ˣ = ${b}, giving x to 3 d.p.`, ans, dp: 3, sol: `x = ln ${b} / ln ${a} = ${fmt(ans, 5)}.` }; },
    () => { const k = pick([0.2, 0.5, 2, 3]), c = R(3, 40); const ans = Math.log(c) / k;
      return { q: `Solve e^(${k}x) = ${c}, giving x to 3 d.p.`, ans, dp: 3, sol: `${k}x = ln ${c}, so x = ln ${c} / ${k} = ${fmt(ans, 5)}.` }; },
    () => { const A = R(2, 9) * 100, k = pick([0.05, 0.1, 0.2, 0.3]), t = R(2, 10); const ans = A * Math.exp(-k * t);
      return { q: `A quantity decays according to N = ${A}e^(−${k}t). Find N when t = ${t}, to 1 d.p.`, ans, dp: 1, sol: `N = ${A}e^(−${fmt(k * t, 3)}) = ${fmt(ans, 3)}.` }; },
    () => { const p = R(2, 9), q = R(2, 9); const ans = Math.log10(p * q * q);
      return { q: `Given log₁₀ ${p} + 2 log₁₀ ${q} = log₁₀ N, find log₁₀ N to 3 d.p.`, ans, dp: 3, sol: `log ${p} + log ${q}² = log(${p} × ${q * q}) = log ${p * q * q} = ${fmt(ans, 4)}.` }; },
  ],
  'm-trig': [
    () => { const r = R(3, 15), th = pick([0.4, 0.6, 0.8, 1.2, 1.5, 2]); const ans = r * th;
      return { q: `A sector has radius ${r} cm and angle ${th} radians. Find the arc length in cm.`, ans, dp: 2, sol: `s = rθ = ${r} × ${th} = ${fmt(ans, 3)} cm.` }; },
    () => { const r = R(3, 15), th = pick([0.4, 0.6, 0.8, 1.2, 1.5, 2]); const ans = 0.5 * r * r * th;
      return { q: `A sector has radius ${r} cm and angle ${th} radians. Find its area in cm² (2 d.p. if needed).`, ans, dp: 2, sol: `A = ½r²θ = 0.5 × ${r * r} × ${th} = ${fmt(ans, 3)} cm².` }; },
    () => { const k = pick([0.2, 0.3, 0.45, 0.6, 0.7, 0.85]); const p = Math.asin(k) * 180 / Math.PI; const ans = 180 - p;
      return { q: `Solve sin x = ${k} for 0° ≤ x < 360°. Enter the larger solution, to 1 d.p.`, ans, dp: 1, sol: `Principal value x = arcsin ${k} = ${fmt(p, 2)}°. Second solution 180° − ${fmt(p, 2)}° = ${fmt(ans, 2)}°.` }; },
    () => { const b = R(4, 12), c = R(4, 12), A = R(30, 120); const ans = Math.sqrt(b * b + c * c - 2 * b * c * Math.cos(A * Math.PI / 180));
      return { q: `In triangle ABC, AB = ${c} cm, AC = ${b} cm and angle BAC = ${A}°. Find BC to 3 s.f. (give 2 d.p.).`, ans, dp: 2, sol: `a² = ${b}² + ${c}² − 2(${b})(${c})cos ${A}° = ${fmt(ans * ans, 3)}, so a = ${fmt(ans, 3)} cm.` }; },
    () => { const a = R(1, 8), b = R(1, 8); const ans = Math.sqrt(a * a + b * b);
      return { q: `Write ${a} cos θ + ${b} sin θ in the form R cos(θ − α). Find R to 3 d.p.`, ans, dp: 3, sol: `R = √(${a}² + ${b}²) = √${a * a + b * b} = ${fmt(ans, 4)}.` }; },
  ],
  'm-coord': [
    () => { const a = R(-6, 6), b = R(-6, 6), r = R(2, 9); const D = -2 * a, E = -2 * b, F = a * a + b * b - r * r;
      return { q: `Find the radius of the circle x² + y²${D ? sgn(D) + 'x' : ''}${E ? sgn(E) + 'y' : ''}${F ? sgn(F) : ''} = 0.`, ans: r, dp: 0, sol: `Complete the square: (x ${sgn(-a)})² + (y ${sgn(-b)})² = ${a * a + b * b - F} = ${r}², so r = ${r}.` }; },
    () => { const x1 = R(-6, 6), y1 = R(-6, 6), x2 = R(-6, 6), y2 = R(-6, 6); const ans = Math.hypot(x2 - x1, y2 - y1);
      return { q: `Find the distance between (${x1}, ${y1}) and (${x2}, ${y2}) to 3 d.p.`, ans, dp: 3, sol: `d = √((${x2 - x1})² + (${y2 - y1})²) = √${(x2 - x1) ** 2 + (y2 - y1) ** 2} = ${fmt(ans, 4)}.` }; },
    () => { const m = pick([2, 3, 4, -2, -3, 0.5, -0.5, 1.5]); const ans = -1 / m;
      return { q: `A line has gradient ${m}. What is the gradient of a line perpendicular to it? (2 d.p. if needed)`, ans, dp: 2, sol: `m₁ × m₂ = −1, so m₂ = −1/${m} = ${fmt(ans, 4)}.` }; },
  ],
  'm-num': [
    () => { const p = R(1, 6), q = R(2, 9), x0 = R(2, 3); const f = x0 ** 3 - p * x0 - q, fd = 3 * x0 * x0 - p; const ans = x0 - f / fd;
      return { q: `f(x) = x³ − ${p}x − ${q}. Using x₀ = ${x0}, apply Newton-Raphson once. Give x₁ to 3 d.p.`, ans, dp: 3, sol: `f(${x0}) = ${f}, f'(x) = 3x² − ${p}, f'(${x0}) = ${fd}. x₁ = ${x0} − (${f})/${fd} = ${fmt(ans, 4)}.` }; },
    () => { const c = R(2, 12), x0 = R(1, 3); const g = (x) => Math.cbrt(c + x); const x1 = g(x0), x2 = g(x1);
      return { q: `Using xₙ₊₁ = ∛(${c} + xₙ) with x₀ = ${x0}, find x₂ to 3 d.p.`, ans: x2, dp: 3, sol: `x₁ = ∛${c + x0} = ${fmt(x1, 5)}; x₂ = ∛(${c} + ${fmt(x1, 5)}) = ${fmt(x2, 5)}.` }; },
  ],
  'm-vec': [
    () => { const a = R(-6, 6), b = R(-6, 6), c = R(-6, 6); const ans = Math.sqrt(a * a + b * b + c * c);
      return { q: `Find the magnitude of ${a}i ${b < 0 ? '−' : '+'} ${Math.abs(b)}j ${c < 0 ? '−' : '+'} ${Math.abs(c)}k to 3 d.p.`, ans, dp: 3, sol: `|v| = √(${a * a} + ${b * b} + ${c * c}) = √${a * a + b * b + c * c} = ${fmt(ans, 4)}.` }; },
    () => { const A = [R(-5, 5), R(-5, 5), R(-5, 5)], B = [R(-5, 5), R(-5, 5), R(-5, 5)]; const d = B.map((v, i) => v - A[i]); const ans = Math.hypot(...d);
      return { q: `A has position vector (${A.join(', ')}) and B has position vector (${B.join(', ')}). Find |AB| to 3 d.p.`, ans, dp: 3, sol: `AB = b − a = (${d.join(', ')}), |AB| = ${fmt(ans, 4)}.` }; },
  ],
  'm-data': [
    () => { const n = R(10, 30); const xs = Array.from({ length: n }, () => R(10, 40)); const sx = xs.reduce((a, b) => a + b, 0), sxx = xs.reduce((a, b) => a + b * b, 0); const mean = sx / n; const ans = Math.sqrt(sxx / n - mean * mean);
      return { q: `For n = ${n} values, Σx = ${sx} and Σx² = ${sxx}. Find the standard deviation to 3 d.p.`, ans, dp: 3, sol: `Mean = ${sx}/${n} = ${fmt(mean, 4)}. Variance = ${sxx}/${n} − ${fmt(mean, 4)}² = ${fmt(ans * ans, 4)}. σ = ${fmt(ans, 4)}.` }; },
    () => { const f = R(6, 40), w = pick([2, 4, 5, 10, 20]); const ans = f / w;
      return { q: `A class from ${w * 2} to ${w * 3} has frequency ${f}. Find its frequency density (2 d.p. if needed).`, ans, dp: 2, sol: `Frequency density = frequency ÷ class width = ${f} ÷ ${w} = ${fmt(ans, 3)}.` }; },
    () => { const q1 = R(10, 30), iqr = R(4, 16); const q3 = q1 + iqr; const ans = q3 + 1.5 * iqr;
      return { q: `Q₁ = ${q1} and Q₃ = ${q3}. Using outliers > Q₃ + 1.5 × IQR, find the upper outlier boundary.`, ans, dp: 1, sol: `IQR = ${iqr}. Boundary = ${q3} + 1.5 × ${iqr} = ${ans}.` }; },
  ],
  'm-prob': [
    () => { const a = R(2, 5) / 10, b = R(2, 5) / 10, i = R(0, Math.round(Math.min(a, b) * 10) - 1) / 10; const u = +(a + b - i).toFixed(2);
      return { q: `P(A) = ${a}, P(B) = ${b} and P(A ∪ B) = ${u}. Find P(A ∩ B).`, ans: i, dp: 2, sol: `P(A ∩ B) = P(A) + P(B) − P(A ∪ B) = ${a} + ${b} − ${u} = ${i}.` }; },
    () => { const b = R(3, 8) / 10, i = R(1, 2) / 10; const ans = i / b;
      return { q: `P(B) = ${b} and P(A ∩ B) = ${i}. Find P(A | B) to 3 d.p.`, ans, dp: 3, sol: `P(A | B) = P(A ∩ B)/P(B) = ${i}/${b} = ${fmt(ans, 4)}.` }; },
    () => { const a = R(1, 8) / 10, b = R(1, 8) / 10; const ans = a * b;
      return { q: `A and B are independent with P(A) = ${a} and P(B) = ${b}. Find P(A ∩ B).`, ans, dp: 2, sol: `Independent, so P(A ∩ B) = ${a} × ${b} = ${fmt(ans, 3)}.` }; },
  ],
  'm-dist': [
    () => { const n = R(6, 15), p = pick([0.1, 0.2, 0.25, 0.3, 0.4, 0.5]), r = R(1, Math.min(5, n)); const ans = comb(n, r) * p ** r * (1 - p) ** (n - r);
      return { q: `X ~ B(${n}, ${p}). Find P(X = ${r}) to 4 d.p.`, ans, dp: 4, sol: `P(X = ${r}) = ${n}C${r} × ${p}^${r} × ${fmt(1 - p, 2)}^${n - r} = ${fmt(ans, 5)}.` }; },
    () => { const mu = R(20, 80), s = R(2, 10), x = mu + R(-2 * s, 2 * s); const z = (x - mu) / s; const ans = Phi(z);
      return { q: `X ~ N(${mu}, ${s}²). Find P(X < ${x}) to 4 d.p.`, ans, dp: 4, sol: `z = (${x} − ${mu})/${s} = ${fmt(z, 4)}. P(Z < ${fmt(z, 3)}) = ${fmt(ans, 5)}.` }; },

function cleanLine(x){ return String(x).trim().replace(/^(?:[-*•–]\s*|\d{1,3}[.)]\s+|[a-z][.)]\s+)+/i, '').replace(/\*\*|__|`/g, '').replace(/^#+\s*/, '').trim(); }
function isChatter(x){ return /^(here (are|is)|here's|sure|certainly|of course|absolutely|great|i hope|i've|i have|let me know|feel free|note:|these (cards|flashcards|topics)|this (list|set)|hope this)/i.test(x) || /[:!]$/.test(x) || (/\?$/.test(x) && x.split(' ').length > 8 && /\b(you|your)\b/i.test(x)); }
function splitCard(line){
  for (const sep of [' :: ', '::', '\t', ' – ', ' — ', ' - ']) { const i = line.indexOf(sep); if (i > 0) return [line.slice(0, i), line.slice(i + sep.length)]; }
  const c = line.indexOf(': '); if (c > 0 && c < 90) return [line.slice(0, c), line.slice(c + 2)];
  return null;
}
function parseCardLines(lines){
  const out = []; let skipped = 0;
  lines.forEach(raw => {
    const line = cleanLine(raw); if (!line || isChatter(line)) return;
    const parts = splitCard(line); if (!parts) { skipped++; return; }
    const q = parts[0].trim(), a = parts[1].replace(/^::\s*/, '').trim();
    if (q && a && q.length < 300) out.push([q, a]); else skipped++;

}

function parseMultiCards(txt, topics){
  const norm = x => x.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const find = h => { const n = norm(h); return topics.find(t => norm(t.name) === n) || topics.find(t => n && (norm(t.name).includes(n) || n.includes(norm(t.name)))); };
  const groups = new Map(); let cur = null, lost = 0, skipped = 0, buf = [];
  const flush = () => { if (!buf.length) return; const r = parseCardLines(buf); skipped += r.skipped; if (cur) { if (!groups.has(cur)) groups.set(cur, []); groups.get(cur).push(...r.pairs); } else lost += r.pairs.length; buf = []; };
  String(txt).split(/\r?\n/).forEach(line => {
    const h = line.trim().match(/^#{1,4}\s*(.+)$/) || line.trim().match(/^\*\*([^*:]+)\*\*$/);
    if (h) { flush(); cur = find(h[1].replace(/\*\*/g, '').trim()) || null; if (!cur) lost++; return; }
    buf.push(line);
  });
  flush();
  return { groups, lost, skipped };
}

// ---------- spaced repetition ----------
// card state: [ease, interval, due(dayNum), reps, lapses, right, wrong, lastTs]
const cs = (id) => S.cards[id];
function previewInterval(id, g){ const c = cs(id); const r = schedule(c ? c.slice() : null, g); return r[1]; }
function schedule(c, g){
  const now = dayNum();
  if (!c) c = [2.5, 0, now, 0, 0, 0, 0, 0];
  let [ease, iv, due, reps, lapses, right, wrong] = c;
  if (g === 0) { lapses += reps ? 1 : 0; ease = Math.max(1.3, ease - 0.2); iv = 0; wrong++; }
  else {
    if (g === 1) { ease = Math.max(1.3, ease - 0.15); iv = reps === 0 || iv < 1 ? 1 : Math.max(iv + 1, Math.round(iv * 1.2)); }
    if (g === 2) { iv = reps === 0 || iv < 1 ? 1 : iv < 3 ? 3 : Math.round(iv * ease); }
    if (g === 3) { ease += 0.15; iv = reps === 0 || iv < 1 ? 3 : Math.round(iv * ease * 1.3); }
    iv = Math.min(iv, 60); reps++; right++;
  }
  return [Math.round(ease*100)/100, iv, now + iv, reps, lapses, right, wrong, Date.now()];
}
function grade(id, g){ S.cards[id] = schedule(cs(id), g); today().c++; save(); }
function recordResult(id, ok){ // used by learn/test/write/match: coarse grading
  const c = cs(id); if (ok && c && c[1] >= 3) { c[5]++; c[7] = Date.now(); today().c++; save(); return; }
  grade(id, ok ? 2 : 0);
}
const ivLabel = (d) => d === 0 ? 'now' : d === 1 ? '1 day' : d < 30 ? d + ' days' : Math.round(d/30) + ' mo';
function cardMastery(id){ const c = cs(id); if (!c || !c[3]) return 0; const iv = c[1]; return iv >= 21 ? 1 : iv >= 10 ? .85 : iv >= 3 ? .6 : iv >= 1 ? .35 : .15; }
function isDue(id){ const c = cs(id); return c && c[2] <= dayNum(); }
function topicStats(tid){
  const ids = BYTOPIC[tid] || []; let m = 0, seen = 0, due = 0, right = 0, wrong = 0;
  ids.forEach(id => { m += cardMastery(id); const c = cs(id); if (c) { seen++; right += c[5]; wrong += c[6]; if (c[2] <= dayNum()) due++; } });
  const dr = S.drills[tid]; if (dr) { right += dr.r; wrong += dr.n - dr.r; }
  const ex = EXAMQ.filter(q=>q.t===tid).map(q=>bestExam(q.id)).filter(x=>x!=null);
  const exPct = ex.length ? ex.reduce((a,b)=>a+b,0)/ex.length : null;
  const att = right + wrong;
  return { n: ids.length, seen, due, mastery: ids.length ? m / ids.length : 0, acc: att ? right / att : null, att, exPct };
}
function weakness(t){ // higher = needs work
  const st = topicStats(t.id); const w = subjWeight(t.s);
  const acc = st.acc == null ? .5 : st.acc; const ex = st.exPct == null ? .5 : st.exPct;
  const next = EXAMS.filter(e=>e.s===t.s && t.papers.includes(e.p) && daysTo(e.d) >= 0).map(e=>daysTo(e.d)).sort((a,b)=>a-b)[0];
  const urgency = next == null ? 0 : next < 30 ? .25 : next < 75 ? .12 : 0;
  const cf = ((S.conf||{})[t.id]||[])[0]; const conf = cf==='r' ? .15 : cf==='a' ? .07 : cf==='g' ? -.05 : 0;
  return ((1 - st.mastery) * .5 + (1 - acc) * .3 + (1 - ex) * .2 + urgency + conf) * w;
}
function bestExam(qid){ const a = S.exam[qid]; if (!a || !a.length) return null; return Math.max(...a.map(x => x.score / x.max)); }
function subjStats(s){
  const ts = liveTopics(s); let n=0, m=0, due=0, seen=0, r=0, att=0;
  ts.forEach(t=>{ const st=topicStats(t.id); n+=st.n; m+=st.mastery*st.n; due+=st.due; seen+=st.seen; if(st.acc!=null){ r+=st.acc*st.att; att+=st.att; } });
  const ex = EXAMQ.filter(q=>q.s===s && topicOn(TOPIC[q.t])).map(q=>bestExam(q.id)).filter(x=>x!=null);
  const exPct = ex.length ? ex.reduce((a,b)=>a+b,0)/ex.length : null;
  const mastery = n ? m/n : 0; const acc = att ? r/att : null;
  const ready = Math.round(100 * (mastery * .55 + (acc==null?0:acc) * .2 + (exPct==null?0:exPct) * .25));
  return { n, mastery, due, seen, acc, exPct, ready, exN: ex.length };
}

function phase(){

  if (d < p2) return 1; if (d < p3) return 2; if (d <= last) return 3; return 4;

  const mockPool = mockOn() && mockTopics().length ? TOPICS.filter(t=>mockTopics().includes(t.id)) : null;
  const subs = mySubj(); if (!subs.length) return tasks;
  const ranked = myTopics().sort((a,b)=>weakness(b)-weakness(a)).sort((a,b)=> mockPool ? mockPool.includes(b) - mockPool.includes(a) : 0);
  if (mockPool) tasks.push({ key:'mock-review', s:null, icon:'flash', title:`${mockCfg().title}: 40-card focus review`, sub:`Your weakest and due cards from the mock topics · ${plural(daysTo(mockCfg().date),'day')} to go`, go:()=>startMockReview() });
  const ph = phase();
  // rotate subjects: psych and maths get more days
  // rotate subjects; ones with a bigger gap between predicted and target grade come up more often
  const rota = subs.flatMap(x => Array(Math.max(1, Math.min(3, gradeGap(x)))).fill(x));
  customCourses().filter(c => !(c.topics||[]).length && !c.pack).forEach(c => tasks.push({ key:'setup-'+c.id, s:c.id, icon:'spark', title:`Set up ${c.name}: add your topics`, sub:'Get the topic list from Claude, or type your own', go:()=>{ SETS_FILTER = c.id; go('sets'); } }));

  const s1 = rota[d % rota.length], s2r = rota[(d + 3) % rota.length], s2 = s2r !== s1 ? s2r : (subs.find(x=>x!==s1) || s1);
  [s1, s2].forEach((s, i) => {
    const t = ranked.filter(t=>t.s===s && (BYTOPIC[t.id]||[]).length)[i===0?0:(s1===s2?1:0)];
    if (!t) return;
    if (t) tasks.push({ key:'learn-'+t.id, s, icon:'learn', title:`Learn: ${t.name}`, sub:`${SUBJ[s].short} · ${mockPool && mockPool.includes(t) ? 'mock topic, one of your weakest' : 'one of your weakest topics right now'}`, go:()=>startMode('learn', setFromTopic(t.id), 'learn-'+t.id) });
  });
  const mt = subs.includes('maths') ? ranked.filter(t=>t.s==='maths' && GEN[t.id] && GEN[t.id].length)[0] : null;
  if (mt) tasks.push({ key:'drill-'+mt.id, s:'maths', icon:'drills', title:`Maths drill: ${mt.name}`, sub:'10 fresh questions with worked solutions', go:()=>startDrill(mt.id, 'drill-'+mt.id) });
  const xsl = (ph >= 2 ? ['psych','econ','maths'] : ['psych','econ']).filter(x=>subs.includes(x)), xs = xsl.length ? xsl[d % xsl.length] : subs[0];
  const xq = (mockPool && mockExamQs(xs).length ? mockExamQs(xs) : EXAMQ.filter(q=>q.s===xs && topicOn(TOPIC[q.t]))).slice().sort((a,b)=>(bestExam(a.id)??-1)-(bestExam(b.id)??-1) || weakness(TOPIC[b.t])-weakness(TOPIC[a.t]))[0];
  if (xq) tasks.push({ key:'exam-'+xq.id, s:xs, icon:'exam', title:`Exam question: ${xq.marks}-marker`, sub:`${SUBJ[xs].short} · ${TOPIC[xq.t].name}`, go:()=>openExam(xq.id, 'exam-'+xq.id) });
  return tasks;
}

// Mock paper: several exam questions under one timer, then marked against the mark schemes (or by Claude).
function pickPaper(s, paper, target){
  const pool = shuffle(EXAMQ.filter(q => q.s===s && topicOn(TOPIC[q.t]) && (paper==='all' || q.paper.startsWith(paper)))).sort((a,b)=>(bestExam(a.id)==null?0:1)-(bestExam(b.id)==null?0:1));
  const out = []; let tot = 0;
  for (const q of pool) { if (tot >= target) break; if (tot + q.marks <= target + 6) { out.push(q); tot += q.marks; } }
  return out;
}
function modePaper(s, paper, target){
  const qs = pickPaper(s, paper, target); const mins = qs.reduce((a,q)=>a+minsFor(q),0);
  const st = { phase:'write', ans:{}, ticks:{}, level:{}, score:{}, start:Date.now(), timer:null, saved:false };
  const total = qs.reduce((a,q)=>a+q.marks,0);
  const sug = (q) => { const T = st.ticks[q.id] || new Set(); const L = st.level[q.id]; if (q.levels && L!=null) { const r = q.levels[L]; return Math.round(r[0] + (r[1]-r[0]) * Math.min(1, T.size/q.points.length*1.2)); } return Math.min(q.marks, Math.round(T.size / q.points.length * q.marks)); };

    if (st.phase==='write') {
      m.innerHTML = studyShell(title, s, 0, `<p class="small muted">${plural(qs.length,'question')} · ${total} marks · about ${mins} minutes. Answer everything, then mark it.</p>
        ${qs.map((q,i)=>`<section class="card stack s-${q.s}" style="gap:10px"><div class="row between"><span class="tiny muted mono">Q${i+1} · ${esc(q.paper)} · ${esc(TOPIC[q.t].name)}</span><span class="mono small"><b>${q.marks}</b> marks</span></div><div class="row between" style="flex-wrap:nowrap;align-items:flex-start;gap:10px"><div style="font-weight:600;line-height:1.5">${esc(q.q)}</div>${sayBtn(q.q)}</div><textarea data-pa="${q.id}" style="min-height:${q.marks>=12?260:140}px" placeholder="Your answer…">${esc(st.ans[q.id]||'')}</textarea></section>`).join('')}
        <div class="row between"><span class="small muted mono" id="pclock">0:00 / ${mins}:00</span><button class="btn primary" id="pfin">Finish and mark</button></div>`, `<span id="ptop">${mins}:00</span>`);
      quitHandler(m);
      clearInterval(st.timer); st.timer = setInterval(()=>{ const c = document.getElementById('pclock'); if (!c) { clearInterval(st.timer); return; } const sec = Math.floor((Date.now()-st.start)/1000); c.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} / ${mins}:00`; const left = Math.max(0, mins*60 - sec); const tp = document.getElementById('ptop'); if (tp) tp.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; if (sec > mins*60) c.style.color = 'var(--bad)'; }, 1000);
      on(m,'[data-pa]','input',e=>{ st.ans[e.target.dataset.pa] = e.target.value; });
      on(m,'#pfin','click',()=>{ clearInterval(st.timer); st.taken = Math.round((Date.now()-st.start)/60000); st.phase='mark'; o.render(m); window.scrollTo(0,0); });
      return;
    }
    const got = qs.reduce((a,q)=>a+(st.score[q.id] ?? sug(q)),0);
    m.innerHTML = studyShell(title, s, 100, `<section class="card pad-lg row between"><div><div class="eyebrow">${st.saved?'Saved':'Your mark so far'}</div><div class="result-big mono">${got}/${total}</div><p class="small muted">${Math.round(got/total*100)}% · took ${plural(st.taken||0,'minute')} of ${mins}</p></div>
        <div class="stack" style="gap:8px">${SAMPLE?`<button class="btn" id="pai">${ic('spark')} Mark it with Claude</button>`:''}<button class="btn primary" id="psave">${st.saved?'Done':'Save marks'}</button></div></section>
      <p class="small muted">Tick each mark-scheme point your answer clearly makes${qs.some(q=>q.levels)?', and pick a level for extended answers':''}. Or press Mark it with Claude for an examiner's view of the whole paper.</p>
      ${qs.map((q,i)=>`<section class="card stack s-${q.s}" style="gap:10px"><div class="row between"><b class="small">Q${i+1} · ${esc(TOPIC[q.t].name)}</b><span class="mono small">${st.score[q.id] ?? sug(q)}/${q.marks}</span></div><div class="small" style="font-weight:600">${esc(q.q)}</div>

function paperPrompt(qs, ans){ const q0 = qs[0]; return `You are a senior A-level examiner for ${SUBJ[q0.s].board} ${SUBJ[q0.s].name}, marking a student's mock paper for the summer ${examYear()} exams. Mark strictly but fairly, as a real examiner would.

For each question give: the mark, the level if it is levels-based, what earned credit, and exactly what to add for more marks. Finish with the total, a grade estimate if you can, and the three most useful things to work on.

${qs.map((q,i)=>`QUESTION ${i+1} (${q.marks} marks, ${q.paper}): ${q.q}
MARK SCHEME POINTS:
${q.points.map(p=>'- '+p).join('\n')}${q.levels?'\nLEVELS: '+q.levels.map((L,j)=>`Level ${q.levels.length-j} (${L[0]}-${L[1]}): ${L[2]}`).join(' | '):''}
STUDENT ANSWER:
${(ans[q.id]||'').trim() || '(no answer)'}`).join('\n\n')}`; }

function priorityCards(ids, n){
  const now = dayNum();
  const score = (id) => { const c = cs(id); if (!c) return 2 + Math.random(); if (c[2] <= now) return 3 + (now - c[2]) * .01 + Math.random()*.1; return 1 - cardMastery(id) + Math.random()*.2; };
  return ids.slice().sort((a,b)=>score(b)-score(a)).slice(0, n);
}
