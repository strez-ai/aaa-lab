<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b4cca">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: app shell with sticky top bar, side rail on wide screens, bottom tab bar on phones; content column max 980px */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --surface-2:#eceef5; --line:#dde0ea; --fg:#151826; --muted:#5d6377; --faint:#8b90a3;
  --accent:#3b4cca; --accent-ink:#ffffff; --accent-soft:#e4e7fb;
  --psych:#8a3ffc; --psych-soft:#efe6ff; --maths:#0f8a7e; --maths-soft:#dcf3f0; --econ:#c2610c; --econ-soft:#fbead9;
  --good:#1d8a4a; --good-soft:#dcf2e4; --warn:#b7791f; --warn-soft:#fbefd6; --bad:#c23b3b; --bad-soft:#f9e0e0;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 16px rgba(20,24,40,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1017; --surface:#171a24; --surface-2:#20243200; --line:#2a2f40; --fg:#eceef6; --muted:#a3a8bd; --faint:#767c93;
  --accent:#8a97ff; --accent-ink:#0e1017; --accent-soft:#232a52;
  --psych:#b98cff; --psych-soft:#2c2142; --maths:#4fd1c0; --maths-soft:#123532; --econ:#f2a25c; --econ-soft:#3a2716;
  --good:#5dd38c; --good-soft:#15331f; --warn:#f0c060; --warn-soft:#3a2f14; --bad:#ff7d7d; --bad-soft:#3d1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1017; --surface:#171a24; --surface-2:#202432; --line:#2a2f40; --fg:#eceef6; --muted:#a3a8bd; --faint:#767c93;
  --accent:#8a97ff; --accent-ink:#0e1017; --accent-soft:#232a52;
  --psych:#b98cff; --psych-soft:#2c2142; --maths:#4fd1c0; --maths-soft:#123532; --econ:#f2a25c; --econ-soft:#3a2716;
  --good:#5dd38c; --good-soft:#15331f; --warn:#f0c060; --warn-soft:#3a2f14; --bad:#ff7d7d; --bad-soft:#3d1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface-2:#202432}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--fg);white-space:nowrap}
.brand-mark{display:inline-flex;gap:2px}
.brand-mark i{display:block;width:9px;height:20px;border-radius:3px}
.brand-mark i:nth-child(1){background:var(--psych)} .brand-mark i:nth-child(2){background:var(--maths);height:26px;margin-top:-6px} .brand-mark i:nth-child(3){background:var(--econ)}
.top-sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:.78rem;font-weight:600;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--good)} .chip.warn .dot{background:var(--warn)}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:4px}
.nav-a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.93rem;border:0;background:none;text-align:left}
.nav-a svg{width:19px;height:19px;flex:none}
.nav-a:hover{background:var(--surface-2);color:var(--fg)}
.nav-a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail .rail-foot{margin-top:18px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.main{min-width:0}
.tabbar{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);padding-block:16px 96px}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar .nav-a{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:.66rem;border-radius:8px;align-items:center;text-align:center}
  .tabbar .nav-a[aria-current="page"]{background:none}
  .hide-sm{display:none!important}
}

/* primitives */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.pad-lg{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;text-decoration:none;color:var(--fg);min-height:42px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.84rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap}
.s-psych{--sc:var(--psych);--ss:var(--psych-soft)} .s-maths{--sc:var(--maths);--ss:var(--maths-soft)} .s-econ{--sc:var(--econ);--ss:var(--econ-soft)}
.pill.subj{background:var(--ss);color:var(--sc)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--sc,var(--accent));transition:width .4s}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:120px;line-height:1.55}
.hr{height:1px;background:var(--line);margin:4px 0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:11px;font-weight:600;font-size:.9rem;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:821px){.toast{bottom:28px}}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.count-big{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,9vw,4.4rem);line-height:.95;letter-spacing:-.03em}
.timeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tl{flex:none;min-width:92px;padding:9px 10px;border-radius:11px;background:var(--ss);border:1px solid transparent}
.tl.past{opacity:.45}
.tl.next{border-color:var(--sc)}
.tl .d{font-family:var(--f-mono);font-size:.76rem;color:var(--sc);font-weight:700}
.tl .n{font-weight:700;font-size:.82rem}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--ss,var(--accent-soft));color:var(--sc,var(--accent));flex:none}
.task .ic svg{width:18px;height:18px}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-weight:600;font-size:.94rem}
.task.done .tx b{text-decoration:line-through;color:var(--muted)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.task.done .check{background:var(--good);border-color:var(--good);color:#fff}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.05}
.subj-card{border-top:4px solid var(--sc)}
.grade{font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.grade .arrow{color:var(--faint);font-weight:500;margin:0 6px}

/* library */
.topic-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 70px;gap:14px;align-items:center;padding:13px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.topic-row:hover{border-color:var(--sc)}
.topic-row .nm{font-weight:650;font-weight:600}
@media (max-width:560px){.topic-row{grid-template-columns:minmax(0,1fr) 70px}.topic-row .tb{display:none}}
.paper-h{display:flex;align-items:baseline;gap:10px;margin:8px 2px 2px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:96px}
.mode:hover{border-color:var(--sc,var(--accent));transform:translateY(-1px)}
.mode svg{width:22px;height:22px;color:var(--sc,var(--accent))}
.mode b{font-size:.95rem}
.mode span{font-size:.78rem;color:var(--muted);line-height:1.3}
.term-list{display:flex;flex-direction:column;gap:8px}
.term{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) auto;gap:16px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);align-items:start}
.term .q{font-weight:600}
.term .a{color:var(--muted);font-size:.9rem}
@media (max-width:640px){.term{grid-template-columns:minmax(0,1fr) auto}.term .a{grid-column:1/-1;grid-row:2}}
.star{border:0;background:none;color:var(--faint);padding:2px;line-height:0}
.star[aria-pressed="true"]{color:var(--warn)}
.star svg{width:20px;height:20px}

/* study */
.study-top{display:flex;align-items:center;gap:12px}
.progress-line{flex:1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--sc,var(--accent));transition:width .3s}
.flash{perspective:1400px;width:100%;max-width:760px;margin:0 auto}
.flash-in{position:relative;min-height:min(56vh,420px);transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:24px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .body{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
.face.front .body{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,3.6vw,1.9rem);line-height:1.25}
.face.back .body{font-size:clamp(.98rem,2.4vw,1.1rem);line-height:1.6;text-align:left;justify-content:flex-start;align-items:flex-start}
@media (prefers-reduced-motion:reduce){.flash-in{transition:none}}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:760px;margin:0 auto;width:100%}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.gbtn small{font-weight:500;color:var(--muted);font-size:.72rem}
.gbtn.again{color:var(--bad)} .gbtn.hard{color:var(--warn)} .gbtn.goodb{color:var(--good)} .gbtn.easy{color:var(--accent)}
.gbtn:hover{background:var(--surface-2)}
.kbd{font-family:var(--f-mono);font-size:.7rem;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--faint)}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);line-height:1.45;font-size:.93rem}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .k{font-family:var(--f-mono);font-size:.75rem;color:var(--faint);margin-right:8px}
.qbox{max-width:760px;margin:0 auto;width:100%}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(1.2rem,3vw,1.55rem);line-height:1.3}
.kw{display:inline-block;padding:1px 8px;border-radius:7px;margin:2px;font-size:.82rem;font-weight:600}
.kw.hit{background:var(--good-soft);color:var(--good)} .kw.miss{background:var(--surface-2);color:var(--muted)}
.feedback{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.feedback.ok{background:var(--good-soft);border-color:transparent}
.feedback.no{background:var(--bad-soft);border-color:transparent}
.match-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.match-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{min-height:104px;padding:10px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-size:.82rem;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.tile.term-t{font-weight:700;font-size:.9rem}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.tile.gone{visibility:hidden}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.result-big{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1}
.ms-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.ms-item:first-child{border-top:0}
.ms-item input{width:20px;height:20px;margin-top:2px;accent-color:var(--good);flex:none}
.level{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.86rem;margin-top:6px}
.level[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ai-out{white-space:pre-wrap;line-height:1.6}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.88rem}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.heat i{border-radius:3px;background:var(--surface-2)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 80%,var(--surface-2))}
.heat i[data-l="4"]{background:var(--accent)}
.phase{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0}
.phase.now .ph-n{color:var(--accent)}
@media (max-width:560px){.phase{grid-template-columns:minmax(0,1fr);gap:4px}}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.hidden-sm{}
</style>

<header class="top"><div class="top-in">
  <a class="brand" href="#home" aria-label="Pedro's AAA Lab home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>AAA Lab</a>
  <div class="top-sp"></div>
  <span class="chip hide-sm" id="countChip"></span>
  <span class="chip" id="syncChip" title="Where your progress is saved"><span class="dot"></span><span id="syncTxt">This device</span></span>
</div></header>

  <nav class="rail" id="rail" aria-label="Main"></nav>
  <main class="main" id="main"><div class="loading">Loading your revision…</div></main>
</div>

<script>
"use strict";
// ---------- config ----------
const SUBJ = {

// card state: [ease, interval, due(dayNum), reps, lapses, right, wrong, lastTs]
const cs = (id) => S.cards[id];
function previewInterval(id, g){ const c = cs(id); const r = schedule(c ? c.slice() : null, g); return r[1]; }
function schedule(c, g){
  const now = dayNum();
  if (!c) c = [2.5, 0, now, 0, 0, 0, 0, 0];
  let [ease, iv, due, reps, lapses, right, wrong] = c;
  if (g === 0) { lapses += reps ? 1 : 0; ease = Math.max(1.3, ease - 0.2); iv = 0; wrong++; }
  else {
    if (g === 1) { ease = Math.max(1.3, ease - 0.15); iv = reps === 0 || iv < 1 ? 1 : Math.max(iv + 1, Math.round(iv * 1.2)); }
    if (g === 2) { iv = reps === 0 || iv < 1 ? 1 : iv < 3 ? 3 : Math.round(iv * ease); }
    if (g === 3) { ease += 0.15; iv = reps === 0 || iv < 1 ? 3 : Math.round(iv * ease * 1.3); }
    iv = Math.min(iv, 60); reps++; right++;
  }
  return [Math.round(ease*100)/100, iv, now + iv, reps, lapses, right, wrong, Date.now()];
}
function grade(id, g){ S.cards[id] = schedule(cs(id), g); today().c++; save(); }
function recordResult(id, ok){ // used by learn/test/write/match: coarse grading
  const c = cs(id); if (ok && c && c[1] >= 3) { c[5]++; c[7] = Date.now(); today().c++; save(); return; }
  grade(id, ok ? 2 : 0);
}
const ivLabel = (d) => d === 0 ? 'now' : d === 1 ? '1 day' : d < 30 ? d + ' days' : Math.round(d/30) + ' mo';
function cardMastery(id){ const c = cs(id); if (!c || !c[3]) return 0; const iv = c[1]; return iv >= 21 ? 1 : iv >= 10 ? .85 : iv >= 3 ? .6 : iv >= 1 ? .35 : .15; }
function isDue(id){ const c = cs(id); return c && c[2] <= dayNum(); }
function topicStats(tid){
  const ids = BYTOPIC[tid] || []; let m = 0, seen = 0, due = 0, right = 0, wrong = 0;
  ids.forEach(id => { m += cardMastery(id); const c = cs(id); if (c) { seen++; right += c[5]; wrong += c[6]; if (c[2] <= dayNum()) due++; } });
  const dr = S.drills[tid]; if (dr) { right += dr.r; wrong += dr.n - dr.r; }
  const ex = EXAMQ.filter(q=>q.t===tid).map(q=>bestExam(q.id)).filter(x=>x!=null);
  const exPct = ex.length ? ex.reduce((a,b)=>a+b,0)/ex.length : null;
  const att = right + wrong;
  return { n: ids.length, seen, due, mastery: ids.length ? m / ids.length : 0, acc: att ? right / att : null, att, exPct };
}
function weakness(t){ // higher = needs work
  const st = topicStats(t.id); const w = SUBJ[t.s].weight;
  const acc = st.acc == null ? .5 : st.acc; const ex = st.exPct == null ? .5 : st.exPct;
  const next = EXAMS.filter(e=>e.s===t.s && t.papers.includes(e.p) && daysTo(e.d) >= 0).map(e=>daysTo(e.d)).sort((a,b)=>a-b)[0];
  const urgency = next == null ? 0 : next < 30 ? .25 : next < 75 ? .12 : 0;
  return ((1 - st.mastery) * .5 + (1 - acc) * .3 + (1 - ex) * .2 + urgency) * w;
}
function bestExam(qid){ const a = S.exam[qid]; if (!a || !a.length) return null; return Math.max(...a.map(x => x.score / x.max)); }
function subjStats(s){
  const ts = TOPICS.filter(t=>t.s===s); let n=0, m=0, due=0, seen=0, r=0, att=0;
  ts.forEach(t=>{ const st=topicStats(t.id); n+=st.n; m+=st.mastery*st.n; due+=st.due; seen+=st.seen; if(st.acc!=null){ r+=st.acc*st.att; att+=st.att; } });
  const ex = EXAMQ.filter(q=>q.s===s).map(q=>bestExam(q.id)).filter(x=>x!=null);
  const exPct = ex.length ? ex.reduce((a,b)=>a+b,0)/ex.length : null;
  const mastery = n ? m/n : 0; const acc = att ? r/att : null;
  const ready = Math.round(100 * (mastery * .55 + (acc==null?0:acc) * .2 + (exPct==null?0:exPct) * .25));
  return { n, mastery, due, seen, acc, exPct, ready, exN: ex.length };
}

// ---------- plan ----------
function phase(){
  const d = dayNum(), p2 = dayNum(dateOf('2027-02-15')), p3 = dayNum(dateOf('2027-04-12')), first = dayNum(dateOf(EXAMS[0].d)), last = dayNum(dateOf('2027-06-16'));
  if (d < p2) return 1; if (d < p3) return 2; if (d <= last) return 3; return 4;
}
function nextExam(){ return EXAMS.find(e => daysTo(e.d) >= 0); }
function dailyTasks(){
  const d = dayNum(), tasks = [];
  const due = CARDS.filter(c=>isDue(c[0])).length;
  if (due) tasks.push({ key:'review', s:null, icon:'review', title:`Review ${Math.min(due, 80)} due cards`, sub:'Spaced repetition keeps what you have learned', go:()=>startReview() });
  const ranked = TOPICS.slice().sort((a,b)=>weakness(b)-weakness(a));
  const ph = phase();
  // rotate subjects: psych and maths get more days
  const rota = ['psych','maths','econ','psych','maths','psych','maths'];
  const s1 = rota[d % 7], s2 = rota[(d + 3) % 7] === s1 ? (s1==='maths'?'psych':'maths') : rota[(d + 3) % 7];
  [s1, s2].forEach((s, i) => {
    const t = ranked.filter(t=>t.s===s && (BYTOPIC[t.id]||[]).length)[i===0?0:(s1===s2?1:0)];
    if (t) tasks.push({ key:'learn-'+t.id, s, icon:'learn', title:`Learn: ${t.name}`, sub:`${SUBJ[s].short} · one of your weakest topics right now`, go:()=>startMode('learn', setFromTopic(t.id), 'learn-'+t.id) });
  });
  const mt = ranked.filter(t=>t.s==='maths' && GEN[t.id] && GEN[t.id].length)[0];
  if (mt) tasks.push({ key:'drill-'+mt.id, s:'maths', icon:'drills', title:`Maths drill: ${mt.name}`, sub:'10 fresh questions with worked solutions', go:()=>startDrill(mt.id, 'drill-'+mt.id) });
  const xs = ph >= 2 ? ['psych','econ','maths'][d % 3] : ['psych','econ'][d % 2];
  const xq = EXAMQ.filter(q=>q.s===xs).sort((a,b)=>(bestExam(a.id)??-1)-(bestExam(b.id)??-1) || weakness(TOPIC[b.t])-weakness(TOPIC[a.t]))[0];
  if (xq) tasks.push({ key:'exam-'+xq.id, s:xs, icon:'exam', title:`Exam question: ${xq.marks}-marker`, sub:`${SUBJ[xs].short} · ${TOPIC[xq.t].name}`, go:()=>openExam(xq.id, 'exam-'+xq.id) });
  return tasks;
}

      try { await SAMPLE(`You are an expert A-level ${SUBJ[t.s].name} tutor (${SUBJ[t.s].board} specification, exams in summer 2027). A student is revising this flashcard.\nTerm: ${c[2]}\nAnswer: ${c[3]}\n\nExplain it in plain English in under 120 words: what it means, a memorable example or analogy, and one exam tip (how it tends to be examined or a common mistake). No headings, no markdown.`, { modelTier:'quick', onText:({text})=>{ st.explain = text; const el = document.getElementById('explainOut'); if (el) el.textContent = text; } }); }
      catch(err){ st.explain = err && err.code==='not_granted' ? 'Explanations are switched off for this page.' : 'Could not get an explanation just now. Try again in a moment.'; }
      o.render(m); });
    on(m,'[data-g]','click',e=>{ const g = +e.currentTarget.dataset.g; grade(c[0], g); st.tally[g]++; if (g===0 && !set.noRequeue) st.order.push(c[0]); st.i++; st.flipped=false; st.explain=null; o.render(m); });
  }, key(e, m){ if (e.key===' ' || e.key==='Enter') { if (!e.target.closest('input,textarea,button')) { e.preventDefault(); m.querySelector('#flipBtn')?.click() || m.querySelector('.flash-in')?.click(); } } else if (st.flipped && '1234'.includes(e.key)) m.querySelector(`[data-g="${+e.key-1}"]`)?.click(); } };
  return o;
}

// distractors
function distractors(c, n=3){
  let pool = (BYTOPIC[c[1]]||[]).filter(id=>id!==c[0]);
  if (pool.length < n) pool = pool.concat(CARDS.filter(x=>TOPIC[x[1]].s===TOPIC[c[1]].s && x[0]!==c[0]).map(x=>x[0]));
  return shuffle(pool).slice(0, n).map(id=>CARD[id]);
}
// keyword check
const STOP = new Set('about above after again against also among because been before being below between both could does doing down during each from further have having here into itself just more most other over same should some such than that their them then there these they this those through under until very were what when where which while will with would your only like used make made many much must often then therefore thus usually within without people person something someone things thing called known'.split(' '));
function keywords(a){ const words = a.replace(/\([^)]*\d{4}[^)]*\)/g,' ').toLowerCase().match(/[a-zà-ÿ][a-zà-ÿ'-]{3,}/g) || []; const out = []; words.forEach(w=>{ if(!STOP.has(w) && !out.includes(w)) out.push(w); }); return out.slice(0, 14); }
function checkTyped(input, answer){ const keys = keywords(answer); const inp = input.toLowerCase(); const stem = (w) => w.slice(0, Math.max(4, Math.min(6, w.length-2))); const hits = keys.filter(k => inp.includes(stem(k))); return { keys, hits, ratio: keys.length ? hits.length / keys.length : 0 }; }
function kwHTML(r){ return r.keys.map(k=>`<span class="kw ${r.hits.includes(k)?'hit':'miss'}">${esc(k)}</span>`).join(''); }

// Learn
function modeLearn(set, taskKey){
  const pool = priorityCards(set.ids, Math.min(set.ids.length, 8));
  const items = pool.map(id=>({ id, stage:0, wrongs:0 })); // stage 0 = mcq, 1 = written, 2 = done
  const st = { q:[...items], cur:null, answered:null, typed:'', check:null, total: items.length*2, doneSteps:0 };
  const nextQ = () => { st.cur = st.q.shift() || null; st.answered = null; st.typed = ''; st.check = null; if (st.cur && st.cur.stage===0) st.opts = shuffle([CARD[st.cur.id], ...distractors(CARD[st.cur.id])]); };
  nextQ();
  const o = { render(m){
    if (!st.cur) { markDone(taskKey); m.innerHTML = summaryCard('Round complete', items.length, `cards learned · ${items.filter(i=>i.wrongs===0).length} with no mistakes`, set.s, true); on(m,'#done','click',endStudy); on(m,'#again','click',()=>{ STUDY = modeLearn(set, taskKey); render(); }); return; }
    const c = CARD[st.cur.id]; const t = TOPIC[c[1]];
    let inner = '';
    if (st.cur.stage === 0) {
      inner = `<div class="qbox stack"><span class="pill subj s-${t.s}" style="align-self:flex-start">${esc(t.name)} · choose</span><div class="prompt">${esc(c[2])}</div>
        <div class="stack" style="gap:8px">${st.opts.map((x,i)=>{ let cl=''; if(st.answered!=null){ if(x[0]===c[0]) cl='right'; else if(i===st.answered) cl='wrong'; } return `<button class="opt ${cl}" data-o="${i}" ${st.answered!=null?'disabled':''}><span class="k">${i+1}</span>${esc(brief(x[3], 200))}</button>`; }).join('')}</div>
        ${st.answered!=null?`<div class="feedback ${st.opts[st.answered][0]===c[0]?'ok':'no'}"><b>${st.opts[st.answered][0]===c[0]?'Correct.':'Not quite.'}</b> <span class="small">${esc(c[3])}</span></div><button class="btn primary" id="next" style="align-self:flex-end">Continue</button>`:''}</div>`;
    } else {
      inner = `<div class="qbox stack"><span class="pill subj s-${t.s}" style="align-self:flex-start">${esc(t.name)} · recall</span><div class="prompt">${esc(c[2])}</div>
        ${st.check==null?`<textarea id="typed" placeholder="Write the key points from memory…">${esc(st.typed)}</textarea><div class="row between"><button class="btn ghost sm" id="dunno">I don't know</button><button class="btn primary" id="checkBtn">Check</button></div>`:
        `<div class="feedback"><div class="eyebrow" style="margin-bottom:6px">Model answer</div><div>${esc(c[3])}</div></div>${st.typed?`<div><div class="small muted" style="margin-bottom:4px">Key terms you used (${st.check.hits.length}/${st.check.keys.length}):</div>${kwHTML(st.check)}</div>`:''}
        <p class="small muted">${st.check.ratio>=.5?'Looks like you got the main ideas.':'You may have missed some key ideas.'} Be honest: did you know it?</p>
        <div class="row" style="justify-content:flex-end"><button class="btn" data-self="0">Not yet</button><button class="btn primary" data-self="1">I knew it</button></div>`}</div>`;
    }
    m.innerHTML = studyShell(set.title + ' · Learn', set.s||t.s, st.doneSteps/st.total*100, inner, `${items.filter(i=>i.stage===2).length}/${items.length}`);
    quitHandler(m);
    on(m,'[data-o]','click',e=>{ st.answered = +e.currentTarget.dataset.o; const ok = st.opts[st.answered][0]===c[0]; if(ok){ st.cur.stage=1; st.doneSteps++; } else { st.cur.wrongs++; recordResult(c[0], false); } o.render(m); });
    on(m,'#next','click',()=>{ st.q.splice(Math.min(st.q.length, st.cur.stage===0?2:st.q.length), 0, st.cur); nextQ(); o.render(m); });
    on(m,'#typed','input',e=>{ st.typed = e.target.value; });
    on(m,'#checkBtn','click',()=>{ st.check = checkTyped(st.typed, c[3]); o.render(m); });
    on(m,'#dunno','click',()=>{ st.typed=''; st.check = checkTyped('', c[3]); o.render(m); });
    on(m,'[data-self]','click',e=>{ const ok = e.currentTarget.dataset.self==='1'; if (ok) { st.cur.stage=2; st.doneSteps++; recordResult(c[0], st.cur.wrongs===0); nextQ(); } else { st.cur.wrongs++; recordResult(c[0], false); st.cur.stage=0; st.doneSteps--; st.q.splice(Math.min(st.q.length,2),0,st.cur); nextQ(); } o.render(m); });
    m.querySelector('#typed')?.focus();
  }, key(e,m){ if (st.cur && st.cur.stage===0 && st.answered==null && '1234'.includes(e.key) && !e.target.closest('textarea,input')) m.querySelector(`[data-o="${+e.key-1}"]`)?.click(); else if (e.key==='Enter' && !e.target.closest('textarea')) m.querySelector('#next')?.click(); } };
  return o;
}

// Write
function modeWrite(set, taskKey){
  const order = priorityCards(set.ids, Math.min(set.ids.length, 12));
  const st = { i:0, typed:'', check:null, right:0 };
  const o = { render(m){
    if (st.i >= order.length) { markDone(taskKey); m.innerHTML = summaryCard('Write complete', `${st.right}/${order.length}`, 'answered correctly from memory', set.s, true); on(m,'#done','click',endStudy); on(m,'#again','click',()=>{ STUDY = modeWrite(set, taskKey); render(); }); return; }
    const c = CARD[order[st.i]]; const t = TOPIC[c[1]];
    m.innerHTML = studyShell(set.title + ' · Write', set.s||t.s, st.i/order.length*100, `<div class="qbox stack"><span class="pill subj s-${t.s}" style="align-self:flex-start">${esc(t.name)}</span><div class="prompt">${esc(c[2])}</div>
      ${st.check==null?`<textarea id="typed" placeholder="Type your answer…">${esc(st.typed)}</textarea><div class="row between"><span class="tiny faint">Ctrl/⌘ + Enter to check</span><button class="btn primary" id="checkBtn">Check</button></div>`:
      `<div class="feedback ${st.check.ratio>=.5?'ok':'no'}"><div class="eyebrow" style="margin-bottom:6px">${st.check.ratio>=.5?'Good coverage':'Missing key ideas'} · ${st.check.hits.length}/${st.check.keys.length} key terms</div>${kwHTML(st.check)}</div>
       <div class="feedback"><div class="eyebrow" style="margin-bottom:6px">Model answer</div>${esc(c[3])}</div>
       <div class="row" style="justify-content:flex-end"><button class="btn" data-self="0">I was wrong</button><button class="btn primary" data-self="1">I was right</button></div>`}</div>`, `${st.i+1}/${order.length}`);
    quitHandler(m);
    on(m,'#typed','input',e=>{ st.typed = e.target.value; });
    on(m,'#typed','keydown',e=>{ if (e.key==='Enter' && (e.ctrlKey||e.metaKey)) m.querySelector('#checkBtn').click(); });
    on(m,'#checkBtn','click',()=>{ st.check = checkTyped(st.typed, c[3]); o.render(m); });
    on(m,'[data-self]','click',e=>{ const ok = e.currentTarget.dataset.self==='1'; if (ok) st.right++; recordResult(c[0], ok); st.i++; st.typed=''; st.check=null; o.render(m); });
    m.querySelector('#typed')?.focus();
  }};
  return o;
}

// Match
function modeMatch(set, taskKey){
  const key = set.topic || set.title;
  const pick = shuffle(set.ids).slice(0, Math.min(6, set.ids.length));
  const tiles = shuffle(pick.flatMap(id=>[{ id, kind:'t', text: CARD[id][2] }, { id, kind:'a', text: brief(CARD[id][3], 110) }]));
  const st = { sel:null, gone:new Set(), start: Date.now(), pen:0, bad:null, finished:null, timer:null };
  const o = { render(m){
    if (st.finished) { clearInterval(st.timer); const best = S.match[key]; m.innerHTML = summaryCard('Matched', st.finished.toFixed(1)+'s', best && best < st.finished ? `Your best is ${best.toFixed(1)}s` : 'New personal best', set.s, true); on(m,'#done','click',endStudy); on(m,'#again','click',()=>{ STUDY = modeMatch(set, taskKey); render(); }); return; }
    m.innerHTML = studyShell(set.title + ' · Match', set.s, st.gone.size/tiles.length*100, `<p class="small muted">Tap a term, then its answer. Wrong pairs add 1 second.</p><div class="match-grid">${tiles.map((x,i)=>`<button class="tile ${x.kind==='t'?'term-t':''} ${st.sel===i?'sel':''} ${st.gone.has(i)?'gone':''} ${st.bad&&st.bad.includes(i)?'bad':''}" data-t="${i}">${esc(x.text)}</button>`).join('')}</div>`, `<span id="mt">0.0</span>s`);
    quitHandler(m);
    const mt = m.querySelector('#mt'); clearInterval(st.timer); st.timer = setInterval(()=>{ if (!document.body.contains(mt)) { clearInterval(st.timer); return; } mt.textContent = ((Date.now()-st.start)/1000 + st.pen).toFixed(1); }, 100);
    on(m,'[data-t]','click',e=>{ const i = +e.currentTarget.dataset.t; st.bad = null;
      if (st.sel == null) { st.sel = i; }
      else if (st.sel === i) { st.sel = null; }
      else { const a = tiles[st.sel], b = tiles[i];
        if (a.id === b.id && a.kind !== b.kind) { st.gone.add(st.sel); st.gone.add(i); st.sel = null; recordResult(a.id, true);
          if (st.gone.size === tiles.length) { st.finished = (Date.now()-st.start)/1000 + st.pen; S.match[key] = S.match[key] ? Math.min(S.match[key], st.finished) : st.finished; markDone(taskKey); save(); } }
        else { st.bad = [st.sel, i]; st.pen += 1; st.sel = null; } }
      o.render(m); });
  }};
  return o;
}

// Test
function modeTest(set, taskKey){
  const st = { phase:'setup', n: Math.min(10, set.ids.length), types:{mcq:true, tf:true, written:true}, qs:[], ans:{}, self:{}, score:null };
  const build = () => { const ids = priorityCards(set.ids, st.n); const kinds = Object.keys(st.types).filter(k=>st.types[k]); st.qs = ids.map((id,i)=>{ const kind = kinds[i % kinds.length]; const c = CARD[id];
    if (kind==='mcq') return { kind, id, opts: shuffle([c, ...distractors(c)]) };
    if (kind==='tf') { const truth = Math.random() < .5; const other = truth ? c : distractors(c,1)[0] || c; return { kind, id, shown: brief(other[3], 220), truth: other[0]===c[0] }; }
    return { kind, id }; }); st.qs = shuffle(st.qs); };
  const o = { render(m){
    if (st.phase==='setup') {
      m.innerHTML = studyShell(set.title + ' · Test', set.s, 0, `<div class="qbox card pad-lg stack"><h2>Set up your test</h2>
        <div><div class="small muted" style="margin-bottom:6px">Questions</div><div class="seg">${[5,10,20,30].filter(n=>n<=Math.max(5,set.ids.length)).map(n=>`<button aria-pressed="${st.n===Math.min(n,set.ids.length)}" data-n="${n}">${n}</button>`).join('')}</div></div>
        <div><div class="small muted" style="margin-bottom:6px">Question types</div><div class="row">${[['mcq','Multiple choice'],['tf','True / false'],['written','Written']].map(([k,l])=>`<label class="row small" style="gap:6px"><input type="checkbox" data-type="${k}" ${st.types[k]?'checked':''}> ${l}</label>`).join('')}</div></div>
        <button class="btn primary" id="go" style="align-self:flex-start">Start test</button></div>`, '');
      quitHandler(m);
      on(m,'[data-n]','click',e=>{ st.n = Math.min(+e.currentTarget.dataset.n, set.ids.length); o.render(m); });
      on(m,'[data-type]','change',e=>{ st.types[e.target.dataset.type] = e.target.checked; if (!Object.values(st.types).some(Boolean)) { st.types.mcq = true; o.render(m); } });
      on(m,'#go','click',()=>{ build(); st.phase='run'; o.render(m); window.scrollTo(0,0); });
      return;
    }
    const answered = st.qs.filter((q,i)=>st.ans[i]!=null && st.ans[i]!=='').length;
    const marked = st.phase==='results';
    const qHTML = st.qs.map((q,i)=>{ const c = CARD[q.id]; const t = TOPIC[c[1]]; const a = st.ans[i];
      let body = '';
      if (q.kind==='mcq') body = `<div class="stack" style="gap:8px">${q.opts.map((x,j)=>{ let cl = a===j ? 'sel' : ''; if (marked) { if (x[0]===c[0]) cl='right'; else if (a===j) cl='wrong'; } return `<button class="opt ${cl}" data-q="${i}" data-a="${j}" ${marked?'disabled':''} style="${a===j&&!marked?'border-color:var(--accent);background:var(--accent-soft)':''}">${esc(brief(x[3],200))}</button>`; }).join('')}</div>`;
      else if (q.kind==='tf') body = `<div class="feedback small">${esc(q.shown)}</div><div class="row">${[['true','True'],['false','False']].map(([v,l])=>{ const sel = a===v; let style = sel && !marked ? 'border-color:var(--accent);background:var(--accent-soft)' : ''; let cl=''; if (marked) { const right = (v==='true')===q.truth; if (right) cl='right'; else if (sel) cl='wrong'; } return `<button class="opt ${cl}" style="width:auto;flex:1;text-align:center;${style}" data-q="${i}" data-a="${v}" ${marked?'disabled':''}>${l}</button>`; }).join('')}</div>`;
      else body = marked ? `<div class="feedback"><div class="eyebrow" style="margin-bottom:4px">Your answer</div>${esc(a||'(blank)')}</div><div class="feedback ok"><div class="eyebrow" style="margin-bottom:4px">Model answer</div>${esc(c[3])}</div>${st.self[i]==null?`<div class="row" style="justify-content:flex-end"><button class="btn sm" data-selfq="${i}" data-v="0">I was wrong</button><button class="btn sm primary" data-selfq="${i}" data-v="1">I was right</button></div>`:`<span class="pill ${st.self[i]?'good':'bad'}">${st.self[i]?'Marked right':'Marked wrong'}</span>`}` : `<textarea data-w="${i}" placeholder="Your answer…" style="min-height:90px">${esc(a||'')}</textarea>`;
      const prompt = q.kind==='tf' ? `Does this match “${esc(c[2])}”?` : esc(c[2]);
      return `<section class="card stack" style="gap:10px"><div class="row between"><span class="tiny muted mono">Q${i+1} · ${q.kind==='mcq'?'Multiple choice':q.kind==='tf'?'True or false':'Written'}</span><span class="pill subj s-${t.s}">${esc(t.name)}</span></div><div style="font-weight:600;font-size:1.02rem">${prompt}</div>${body}</section>`; }).join('');
    let head = '';
    if (marked) { const auto = st.qs.map((q,i)=>q.kind==='written' ? st.self[i] : q.kind==='mcq' ? q.opts[st.ans[i]]?.[0]===q.id : st.ans[i]!=null && ((st.ans[i]==='true')===q.truth));
      const right = auto.filter(x=>x===true).length; const pending = auto.filter(x=>x==null).length;
      head = `<div class="card pad-lg row between"><div><div class="eyebrow">Your score</div><div class="result-big mono">${Math.round(right/st.qs.length*100)}%</div><p class="small muted">${right} of ${st.qs.length} correct${pending?` · mark ${pending} written answer${pending>1?'s':''} below`:''}</p></div><div class="row"><button class="btn" id="done">Done</button><button class="btn primary" id="retake">New test</button></div></div>`; }
    m.innerHTML = studyShell(set.title + ' · Test', set.s, marked?100:answered/st.qs.length*100, `${head}<div class="qbox stack">${qHTML}${marked?'':`<button class="btn primary" id="submit" style="align-self:flex-end">Submit test</button>`}</div>`, `${answered}/${st.qs.length}`);
    quitHandler(m);
    on(m,'[data-q]','click',e=>{ const i = +e.currentTarget.dataset.q; const v = e.currentTarget.dataset.a; st.ans[i] = st.qs[i].kind==='mcq' ? +v : v; const y = window.scrollY; o.render(m); window.scrollTo(0,y); });
    on(m,'[data-w]','input',e=>{ st.ans[+e.target.dataset.w] = e.target.value; });
    on(m,'#submit','click',()=>{ st.phase='results'; st.qs.forEach((q,i)=>{ if (q.kind==='mcq') recordResult(q.id, q.opts[st.ans[i]]?.[0]===q.id); else if (q.kind==='tf') recordResult(q.id, st.ans[i]!=null && ((st.ans[i]==='true')===q.truth)); }); markDone(taskKey); o.render(m); window.scrollTo(0,0); });
    on(m,'[data-selfq]','click',e=>{ const i = +e.currentTarget.dataset.selfq; const ok = e.currentTarget.dataset.v==='1'; st.self[i] = ok; recordResult(st.qs[i].id, ok); const y = window.scrollY; o.render(m); window.scrollTo(0,y); });
    on(m,'#done','click',endStudy);
    on(m,'#retake','click',()=>{ STUDY = modeTest(set, taskKey); render(); });
  }};
  return o;
}

// ---------- review view ----------

// ---------- exam questions ----------
let EXAM_FILTER = 'psych', EXAM_TOPIC = null;
function vExam(m){
  const list = EXAMQ.filter(q=>q.s===EXAM_FILTER && (!EXAM_TOPIC || q.t===EXAM_TOPIC));
  m.innerHTML = `<div class="stack"><div class="row between"><div><div class="eyebrow">Exam-style practice</div><h1>Exam questions</h1></div>

      <div class="stack" style="gap:8px"><h3>Back up or move your progress</h3><p class="small muted">Progress ${SYNC.ref?'syncs between your devices when you are signed in to Claude, and is':'is'} also saved in this browser. Copy the backup code to keep a copy, or paste one to restore.</p>
        <div class="row"><button class="btn sm" id="copyBk">Copy backup code</button><button class="btn sm" id="showImp">Restore from code</button><button class="btn sm ghost" id="reset" style="color:var(--bad)">Reset progress</button></div>
        <div id="impBox" hidden class="stack" style="gap:8px"><textarea id="impTxt" placeholder="Paste a backup code here"></textarea><button class="btn sm primary" id="doImp" style="align-self:flex-start">Restore</button></div>
        <div id="resetBox" hidden class="feedback no row between"><span class="small">This deletes all card progress and exam marks on every device. It cannot be undone.</span><button class="btn sm" id="doReset">Yes, reset everything</button></div></div>
    </section>
    <section class="card stack"><h3>About the content</h3><p class="small muted">Cards follow the current specifications: AQA A-level Psychology 7182 (updated for first A-level exams in 2027, including the new Clinical Psychology and Mental Health topic; your options Relationships, Schizophrenia and Forensic Psychology), Pearson Edexcel A-level Mathematics 9MA0 (Issue 4, large data set: Met Office weather 1987 and 2015), and Pearson Edexcel A-level Economics A 9EC0 (Issue 2). Exam questions are original practice questions in the style of each board, not past-paper questions. Check anything surprising against your class notes and the official specification.</p></section>
  </div>`;
  on(m,'[data-learn]','click',e=>startMode('learn', setFromTopic(e.currentTarget.dataset.learn)));
  on(m,'#setName','change',e=>{ S.settings.name = e.target.value.trim() || 'Pedro'; save(); });
  on(m,'#setGoal','change',e=>{ S.settings.goal = Math.max(10, Math.min(400, +e.target.value || 60)); save(); renderNav(); });
  on(m,'[data-grade]','change',e=>{ S.settings.grades[e.target.dataset.grade][+e.target.dataset.i] = e.target.value; save(); });
  on(m,'#copyBk','click',async ()=>{ const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); try { await navigator.clipboard.writeText(code); toast('Backup code copied'); } catch(e){ const b = m.querySelector('#impBox'); b.hidden = false; const ta = m.querySelector('#impTxt'); ta.value = code; ta.select(); toast('Select all and copy the code'); } });
  on(m,'#showImp','click',()=>{ m.querySelector('#impBox').hidden = false; });
  on(m,'#doImp','click',()=>{ try { const o = JSON.parse(decodeURIComponent(escape(atob(m.querySelector('#impTxt').value.trim())))); if (!o || !o.cards) throw 0; S = mergeState(S, o); save(); toast('Progress restored'); render(); } catch(e){ toast('That code is not valid. Copy it again in full.'); } });
  on(m,'#saveKey','click',()=>{ const v = m.querySelector('#apiKey').value.trim(); if (!/^sk-ant-/.test(v)) { toast('That does not look like an Anthropic API key'); return; } setKey(v); toast('Key saved on this device'); render(); });
  on(m,'#clearKey','click',()=>{ setKey(''); toast('Key removed'); render(); });
  on(m,'#ghOn','click',async ()=>{ const v = m.querySelector('#ghTok').value.trim(); if (!/^(ghp_|github_pat_|gho_)/.test(v)) { toast('That does not look like a GitHub token'); return; } ghSet({ token:v, gist:null }); toast('Connecting…'); await initGhSync(); if (SYNC.gh) { toast('Sync is on'); } else { ghSet(null); toast('GitHub did not accept that token. Check it and try again.'); } render(); });
  on(m,'#ghNow','click',async ()=>{ if (!SYNC.gh) await initGhSync(); else { setSync('warn','Syncing…'); try { await ghPush(); setSync('ok','Synced'); toast('Synced'); } catch(e){ setSync('warn','Sync retrying'); toast('Could not reach GitHub just now'); } } render(); });
  on(m,'#ghOff','click',()=>{ ghSet(null); SYNC.gh = false; setSync('local','Saved on this device'); toast('Sync turned off on this device'); render(); });
  on(m,'#reset','click',()=>{ m.querySelector('#resetBox').hidden = false; });
  on(m,'#doReset','click',()=>{ const keep = S.settings; SYNC.overwrite = true; S = blank(); S.settings = keep; save(); toast('Progress reset'); render(); });
}

// ---------- boot ----------
document.addEventListener('keydown', e => { if (STUDY && STUDY.key) STUDY.key(e, document.getElementById('main')); if (e.key==='Escape' && STUDY) endStudy(); });
async function boot(){
  loadLocal();
  const h = location.hash.slice(1); VIEW = NAV.some(n=>n[0]===h) ? h : 'home';
  renderNav();
  try {
    const res = await fetch('content.json'); const data = await res.json();
    CARDS = data.cards; EXAMQ = data.exam;
    CARDS.forEach(c => { CARD[c[0]] = c; (BYTOPIC[c[1]] ||= []).push(c[0]); });
  } catch(e) { document.getElementById('main').innerHTML = '<div class="empty">The revision content could not load. Check your connection and reload the page.</div>'; return; }
  render();
  initSync(); initSample();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
