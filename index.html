function summaryCard(title, big, sub, s, again){ return `<div class="qbox stack ${s?'s-'+s:''}" style="align-items:center;text-align:center;padding:30px 0"><div class="eyebrow">${esc(title)}</div><div class="result-big mono">${big}</div><p class="muted">${sub}</p><div class="row" style="justify-content:center"><button class="btn" id="done">Done</button>${again?'<button class="btn primary" id="again">Go again</button>':''}</div></div>`; }

// Flashcards
function modeFlash(set, taskKey){
  const order = set.review ? set.ids.slice() : priorityCards(set.ids, Math.min(set.ids.length, 30));
  const st = { i:0, flipped:false, order, tally:[0,0,0,0], explain:null };
  const front = S.settings.front;
  const o = { render(m){
    if (st.i >= st.order.length) { markDone(taskKey); m.innerHTML = summaryCard(set.title+' complete', st.order.length, `cards reviewed · ${st.tally[0]} to relearn, ${st.tally[2]+st.tally[3]} known well`, set.s, true); on(m,'#done','click',endStudy); on(m,'#again','click',()=>{ STUDY = set.review ? reviewSession(set, taskKey) : modeFlash(set, taskKey); render(); }); return; }
    const c = CARD[st.order[st.i]]; const t = TOPIC[c[1]];
    const qside = front==='term' ? c[2] : c[3], aside = front==='term' ? c[3] : c[2];
    m.innerHTML = studyShell(set.title, t.s, st.i/st.order.length*100, `
      <div class="flash ${st.flipped?'flipped':''}" id="flash"><div class="flash-in" role="button" tabindex="0" aria-label="Flip card">
        <div class="face front s-${t.s}"><div class="row between"><span class="pill subj">${esc(t.name)}</span><button class="star" aria-label="Star" aria-pressed="${!!S.star[c[0]]}" data-star>${ic('star','fill="'+(S.star[c[0]]?'currentColor':'none')+'"')}</button></div><div class="body"><div>${esc(qside)}</div></div><div class="row between"><span class="tiny faint">Tap or press space to flip</span>${sayBtn(qside)}</div></div>
        <div class="face back s-${t.s}"><div class="row between"><span class="pill subj">Answer</span>${SAMPLE?`<button class="btn ghost sm" data-explain>${ic('spark')} Explain</button>`:''}</div><div class="body"><div style="width:100%"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start;gap:10px"><span>${esc(aside)}</span>${sayBtn(aside)}</div>${st.explain!=null?`<div class="feedback" style="margin-top:14px"><div class="eyebrow" style="margin-bottom:4px">Claude explains</div><div class="ai-out small" id="explainOut">${esc(st.explain)}</div></div>`:''}</div></div></div>
      </div></div>
      ${st.flipped ? `<div class="grades">${[['again','Again',0],['hard','Hard',1],['goodb','Good',2],['easy','Easy',3]].map(([cl,l,g])=>`<button class="gbtn ${cl}" data-g="${g}">${l}<small>${ivLabel(previewInterval(c[0],g))} <span class="kbd">${g+1}</span></small></button>`).join('')}</div>` : `<div class="row" style="justify-content:center"><button class="btn primary" id="flipBtn">Show answer</button></div>`}
    `, `${st.i+1}/${st.order.length}`, set.review ? reviewPickHTML() : '');
    quitHandler(m); if (set.review) bindReviewPick(m, set, taskKey, () => st.order.slice(st.i));
    const flip = () => { st.flipped = !st.flipped; o.render(m); };
    on(m,'.flash-in','click',e=>{ if(e.target.closest('[data-explain],[data-star],[data-say]')) return; flip(); });
    on(m,'#flipBtn','click',flip);
    on(m,'[data-star]','click',e=>{ e.stopPropagation(); S.star[c[0]] = !S.star[c[0]]; if(!S.star[c[0]]) delete S.star[c[0]]; save(); o.render(m); });
    on(m,'[data-explain]','click',async e=>{ e.stopPropagation(); st.explain = 'Thinking…'; o.render(m);
      try { await SAMPLE(`You are an expert A-level ${SUBJ[t.s].name} tutor (${SUBJ[t.s].board} specification, exams in summer ${examYear()}). A student is revising this flashcard.\nTerm: ${c[2]}\nAnswer: ${c[3]}\n\nExplain it in plain English in under 120 words: what it means, a memorable example or analogy, and one exam tip (how it tends to be examined or a common mistake). No headings, no markdown.`, { modelTier:'quick', onText:({text})=>{ st.explain = text; const el = document.getElementById('explainOut'); if (el) el.textContent = text; } }); }
      catch(err){ st.explain = err && err.code==='not_granted' ? 'Explanations are switched off for this page.' : 'Could not get an explanation just now. Try again in a moment.'; }
      o.render(m); });
    on(m,'[data-g]','click',e=>{ const g = +e.currentTarget.dataset.g; grade(c[0], g); st.tally[g]++; if (g===0 && !set.noRequeue) st.order.push(c[0]); st.i++; st.flipped=false; st.explain=null; o.render(m); });
  }, key(e, m){ if (e.key===' ' || e.key==='Enter') { if (!e.target.closest('input,textarea,button,select')) { e.preventDefault(); m.querySelector('#flipBtn')?.click() || m.querySelector('.flash-in')?.click(); } } else if (st.flipped && '1234'.includes(e.key)) m.querySelector(`[data-g="${+e.key-1}"]`)?.click(); } };
  return o;
}

// Review styles: every style grades the card through the same spaced-repetition schedule as flashcards.
const REVIEW_STYLES = [['flash','Flashcards'],['mcq','Multiple choice'],['type','Type the answer'],['blank','Fill the gap'],['mix','Mix']];
function reviewStyle(){ const v = S.settings.reviewMode; return REVIEW_STYLES.some(x=>x[0]===v) ? v : 'flash'; }
function reviewSession(set, taskKey){ return reviewStyle()==='flash' ? modeFlash(set, taskKey) : modeQuiz(set, taskKey); }
function reviewPickHTML(){ return `<label class="row small muted" style="gap:6px;flex-wrap:nowrap">Style <select id="rvStyle" aria-label="Review style">${REVIEW_STYLES.map(([k,l])=>`<option value="${k}" ${reviewStyle()===k?'selected':''}>${l}</option>`).join('')}</select></label>`; }
function bindReviewPick(m, set, taskKey, left){ on(m,'#rvStyle','change',e=>{ S.settings.reviewMode = e.target.value; save(); const ids = left(); if (!ids.length) return; STUDY = reviewSession({ ...set, ids }, taskKey); render(); }); }
// Fill the gap: hide one key word of the answer.
function gapFor(c){
  const a = c[3]; const keys = keywords(a).filter(k => k.length >= 4 && !/\d/.test(k));
  const found = keys.map(k => { const re = new RegExp(`(^|[^a-zà-ÿ'-])(${k.replace(/[-]/g,'\\-')})(?=$|[^a-zà-ÿ'-])`, 'i'); const mm = re.exec(a); return mm ? { word: mm[2], at: mm.index + mm[1].length } : null; }).filter(Boolean);
  if (!found.length) return null;
  const pick = found.slice().sort((x,y)=>y.word.length-x.word.length)[Math.floor(Math.random()*Math.min(3, found.length))];
  return { before: a.slice(0, pick.at), word: pick.word, after: a.slice(pick.at + pick.word.length) };
}
function editDist(a, b){ const d = Array.from({length:a.length+1}, (_,i)=>[i]); for (let j=1;j<=b.length;j++) d[0][j]=j; for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function gapOK(typed, word){ const t = typed.trim().toLowerCase().replace(/[^a-zà-ÿ'-]/g,''), w = word.toLowerCase(); if (!t) return false; if (t === w) return true; const slack = w.length >= 9 ? 2 : w.length >= 5 ? 1 : 0; return editDist(t, w) <= slack || (t.length >= 5 && w.startsWith(t.replace(/(es|s|ed|ing)$/,'')) && Math.abs(t.length - w.length) <= 3); }
function modeQuiz(set, taskKey){
  const style = reviewStyle();
  const st = { i:0, order:set.ids.slice(), tally:[0,0,0,0], cur:null };
  const label = { mcq:'Multiple choice', type:'Type the answer', blank:'Fill the gap' };
  const setup = () => { const c = CARD[st.order[st.i]]; let kind = style === 'mix' ? ['mcq','type','blank'][Math.floor(Math.random()*3)] : style;
    const q = { kind, picked:null, typed:'', checked:null };
    if (kind==='blank') { q.gap = gapFor(c); if (!q.gap) q.kind = kind = 'type'; }
    if (kind==='mcq') { const ds = distractors(c); if (!ds.length) q.kind = 'type'; else q.opts = shuffle([c, ...ds]); }
    st.cur = q; };
  const finish = (g) => { const c = CARD[st.order[st.i]]; grade(c[0], g); st.tally[g]++; if (g===0 && !set.noRequeue) st.order.push(c[0]); st.i++; st.cur = null; };
  const gradeRow = (gs, hint) => `<div class="grades" style="grid-template-columns:repeat(${gs.length},minmax(0,1fr))">${gs.map(g=>{ const [cl,l] = [['again','Again'],['hard','Hard'],['goodb','Good'],['easy','Easy']][g]; const id = CARD[st.order[st.i]][0]; return `<button class="gbtn ${cl}" data-g="${g}" ${hint===g?'style="border-color:currentColor"':''}>${l}<small>${ivLabel(previewInterval(id,g))} <span class="kbd">${g+1}</span></small></button>`; }).join('')}</div>`;
  const o = { guard(){ return !!(st.cur && st.cur.typed && st.cur.checked == null); }, leaveMsg:'Leave this review? Your typed answer will be lost.',
  render(m){
    if (st.i >= st.order.length) { markDone(taskKey); m.innerHTML = summaryCard(set.title+' complete', st.order.length, `cards reviewed · ${st.tally[0]} to relearn, ${st.tally[2]+st.tally[3]} known well`, set.s, true); on(m,'#done','click',()=>{ STUDY = null; render(); }); on(m,'#again','click',()=>{ STUDY = reviewSession(set, taskKey); render(); }); return; }
    if (!st.cur) setup();
    const q = st.cur, c = CARD[st.order[st.i]], t = TOPIC[c[1]];
    const head = `<div class="row between"><span class="pill subj s-${t.s}">${esc(t.name)} · ${label[q.kind]}</span><button class="star" aria-label="Star" aria-pressed="${!!S.star[c[0]]}" data-star>${ic('star','fill="'+(S.star[c[0]]?'currentColor':'none')+'"')}</button></div>
      <div class="row between" style="flex-wrap:nowrap;align-items:flex-start;gap:10px"><div class="prompt">${esc(c[2])}</div>${sayBtn(c[2])}</div>`;
    let body = '';
    if (q.kind==='mcq') {
      const ok = q.picked!=null && q.opts[q.picked][0]===c[0];
      body = `<div class="stack" style="gap:8px">${q.opts.map((x,i)=>{ let cl=''; if(q.picked!=null){ if(x[0]===c[0]) cl='right'; else if(i===q.picked) cl='wrong'; } return `<button class="opt ${cl}" data-o="${i}" ${q.picked!=null?'disabled':''}><span class="k">${i+1}</span>${esc(brief(x[3], 200))}</button>`; }).join('')}</div>`
        + (q.picked==null ? '' : ok ? `<div class="feedback ok"><b>Correct.</b> <span class="small">${esc(c[3])}</span></div><p class="small muted">How easy was that?</p>${gradeRow([1,2,3], 2)}`
          : `<div class="feedback no"><b>Not quite.</b> <span class="small">${esc(c[3])}</span><div class="small muted" style="margin-top:6px">The answer you picked describes <b>${esc(q.opts[q.picked][2])}</b>. This card comes back later in the session.</div></div><button class="btn primary" id="next" style="align-self:flex-end">Continue</button>`);
    } else if (q.kind==='blank') {
      const g = q.gap, ok = q.checked;
      body = `<div class="feedback" style="line-height:1.7">${esc(g.before)}${q.checked==null?`<input id="gapIn" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(q.typed)}" aria-label="Missing word" style="display:inline-block;width:${Math.max(6, g.word.length+2)}ch;padding:2px 6px;margin:0 2px">`:`<b style="color:var(--${ok?'good':'bad'})">${esc(g.word)}</b>`}${esc(g.after)}</div>`
        + (q.checked==null ? `<div class="row between"><button class="btn ghost sm" id="dunno">I don't know</button><button class="btn primary" id="checkBtn">Check</button></div>`
          : ok ? `<div class="feedback ok"><b>Correct.</b>${q.typed.trim().toLowerCase()!==g.word.toLowerCase()?` <span class="small">You wrote “${esc(q.typed.trim())}”, close enough.</span>`:''}</div><p class="small muted">How easy was that?</p>${gradeRow([1,2,3], 2)}`
          : `<div class="feedback no"><b>Not quite.</b> <span class="small">${q.typed.trim()?`You wrote “${esc(q.typed.trim())}”. `:''}The missing word is <b>${esc(g.word)}</b>. This card comes back later in the session.</span></div><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" id="override">I was right</button><button class="btn primary" id="next">Continue</button></div>`);
    } else {
      const r = q.checked;
      body = r==null ? `<textarea id="typed" placeholder="Type your answer…">${esc(q.typed)}</textarea><div class="row between"><button class="btn ghost sm" id="dunno">I don't know</button><span class="row" style="gap:10px"><span class="tiny faint">Ctrl/⌘ + Enter</span><button class="btn primary" id="checkBtn">Check</button></span></div>`
        : `${q.typed.trim()?`<div class="feedback"><div class="eyebrow" style="margin-bottom:4px">Your answer</div>${esc(q.typed)}</div>`:''}<div class="feedback ok"><div class="eyebrow" style="margin-bottom:6px">Model answer</div>${esc(c[3])}</div>
          ${q.typed.trim()?`<div><div class="small muted" style="margin-bottom:4px">Key terms you used (${r.hits.length}/${r.keys.length}):</div>${kwHTML(r)}</div>`:''}
          <p class="small muted">${!q.typed.trim()?'No answer, so this one is Again.':r.ratio>=.5?'Looks like you got the main ideas. Your own wording can still count.':'You may have missed some key ideas. Your own wording can still count.'} Rate how well you knew it.</p>${gradeRow([0,1,2,3], !q.typed.trim()?0:r.ratio>=.75?2:r.ratio>=.4?1:0)}`;
    }
    m.innerHTML = studyShell(set.title, set.s||t.s, st.i/st.order.length*100, `<div class="qbox stack">${head}${body}</div>`, `${st.i+1}/${st.order.length}`, reviewPickHTML());
    quitHandler(m); bindReviewPick(m, set, taskKey, () => st.order.slice(st.i));
    on(m,'[data-star]','click',()=>{ S.star[c[0]] = !S.star[c[0]]; if(!S.star[c[0]]) delete S.star[c[0]]; save(); o.render(m); });
    on(m,'[data-o]','click',e=>{ q.picked = +e.currentTarget.dataset.o; if (q.opts[q.picked][0]!==c[0]) q.wrong = true; o.render(m); });
    on(m,'#typed','input',e=>{ q.typed = e.target.value; });
    on(m,'#typed','keydown',e=>{ if (e.key==='Enter' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); m.querySelector('#checkBtn').click(); } });
    on(m,'#gapIn','input',e=>{ q.typed = e.target.value; });
    on(m,'#gapIn','keydown',e=>{ if (e.key==='Enter') { e.preventDefault(); e.stopPropagation(); m.querySelector('#checkBtn').click(); } });
    on(m,'#checkBtn','click',()=>{ q.checked = q.kind==='blank' ? gapOK(q.typed, q.gap.word) : checkTyped(q.typed, c[3]); o.render(m); });
    on(m,'#dunno','click',()=>{ q.typed = ''; q.checked = q.kind==='blank' ? false : checkTyped('', c[3]); o.render(m); });
    on(m,'#override','click',()=>{ q.checked = true; o.render(m); });
    on(m,'#next','click',()=>{ finish(0); o.render(m); });
    on(m,'[data-g]','click',e=>{ finish(+e.currentTarget.dataset.g); o.render(m); });
    (m.querySelector('#gapIn') || m.querySelector('#typed'))?.focus();
  }, key(e, m){
    if (e.target.closest('textarea,input,select')) return;
    const q = st.cur; if (!q) { if (e.key==='Enter') m.querySelector('#again')?.click(); return; }
    if (q.kind==='mcq' && q.picked==null && '1234'.includes(e.key)) { m.querySelector(`[data-o="${+e.key-1}"]`)?.click(); return; }
    if ('1234'.includes(e.key) && m.querySelector(`[data-g="${+e.key-1}"]`)) { m.querySelector(`[data-g="${+e.key-1}"]`).click(); return; }
    if (e.key==='Enter') { e.preventDefault(); (m.querySelector('#next') || m.querySelector('[data-g="2"]'))?.click(); }
  } };
  return o;
}

// distractors
function distractors(c, n=3){
  let pool = (BYTOPIC[c[1]]||[]).filter(id=>id!==c[0]);
  if (pool.length < n) pool = pool.concat(CARDS.filter(x=>TOPIC[x[1]].s===TOPIC[c[1]].s && x[0]!==c[0]).map(x=>x[0]));
  return shuffle(pool).slice(0, n).map(id=>CARD[id]);
}
// keyword check
const STOP = new Set('said says found find gave give gives leads lead want wants process using used based show shows shown means mean less high higher lower another first second third each also into onto upon example examples way ways tend tends likely type types part parts kind role able around rather quite however whereas although though while about above after again against also among because been before being below between both could does doing down during each from further have having here into itself just more most other over same should some such than that their them then there these they this those through under until very were what when where which while will with would your only like used make made many much must often then therefore thus usually within without people person something someone things thing called known'.split(' '));
function keywords(a){ const words = a.replace(/\([^)]*\d{4}[^)]*\)/g,' ').toLowerCase().match(/[a-zà-ÿ][a-zà-ÿ'-]{3,}/g) || []; const out = []; words.forEach(w=>{ if(!STOP.has(w) && !out.includes(w)) out.push(w); }); return out.slice(0, 14); }
function checkTyped(input, answer){ const keys = keywords(answer); const inp = input.toLowerCase(); const stem = (w) => w.slice(0, Math.max(4, Math.min(6, w.length-2))); const hits = keys.filter(k => inp.includes(stem(k))); return { keys, hits, ratio: keys.length ? hits.length / keys.length : 0 }; }
function kwHTML(r){ return r.keys.map(k=>`<span class="kw ${r.hits.includes(k)?'hit':'miss'}">${esc(k)}</span>`).join(''); }

// Learn
function modeLearn(set, taskKey){
  const pool = priorityCards(set.ids, Math.min(set.ids.length, 8));
  const items = pool.map(id=>({ id, stage:0, wrongs:0 })); // stage 0 = mcq, 1 = written, 2 = done
  const st = { q:[...items], cur:null, answered:null, typed:'', check:null, total: items.length*2, doneSteps:0 };
  const nextQ = () => { st.cur = st.q.shift() || null; st.answered = null; st.typed = ''; st.check = null; if (st.cur && st.cur.stage===0) st.opts = shuffle([CARD[st.cur.id], ...distractors(CARD[st.cur.id])]); };
  nextQ();
  const o = { render(m){
    if (!st.cur) { markDone(taskKey); m.innerHTML = summaryCard('Round complete', items.length, `cards learned · ${items.filter(i=>i.wrongs===0).length} with no mistakes`, set.s, true); on(m,'#done','click',endStudy); on(m,'#again','click',()=>{ STUDY = modeLearn(set, taskKey); render(); }); return; }
    const c = CARD[st.cur.id]; const t = TOPIC[c[1]];
    let inner = '';
    if (st.cur.stage === 0) {
      inner = `<div class="qbox stack"><span class="pill subj s-${t.s}" style="align-self:flex-start">${esc(t.name)} · choose</span><div class="row between" style="flex-wrap:nowrap;align-items:flex-start;gap:10px"><div class="prompt">${esc(c[2])}</div>${sayBtn(c[2])}</div>
        <div class="stack" style="gap:8px">${st.opts.map((x,i)=>{ let cl=''; if(st.answered!=null){ if(x[0]===c[0]) cl='right'; else if(i===st.answered) cl='wrong'; } return `<button class="opt ${cl}" data-o="${i}" ${st.answered!=null?'disabled':''}><span class="k">${i+1}</span>${esc(brief(x[3], 200))}</button>`; }).join('')}</div>
        ${st.answered!=null?`<div class="feedback ${st.opts[st.answered][0]===c[0]?'ok':'no'}"><b>${st.opts[st.answered][0]===c[0]?'Correct.':'Not quite.'}</b> <span class="small">${esc(c[3])}</span>${st.opts[st.answered][0]!==c[0]?`<div class="small muted" style="margin-top:6px">The answer you picked describes <b>${esc(st.opts[st.answered][2])}</b>.</div>`:''}</div><button class="btn primary" id="next" style="align-self:flex-end">Continue</button>`:''}</div>`;
    } else {
      inner = `<div class="qbox stack"><span class="pill subj s-${t.s}" style="align-self:flex-start">${esc(t.name)} · recall</span><div class="row between" style="flex-wrap:nowrap;align-items:flex-start;gap:10px"><div class="prompt">${esc(c[2])}</div>${sayBtn(c[2])}</div>
        ${st.check==null?`<textarea id="typed" placeholder="Write the key points from memory…">${esc(st.typed)}</textarea><div class="row between"><button class="btn ghost sm" id="dunno">I don't know</button><button class="btn primary" id="checkBtn">Check</button></div>`:
        `<div class="feedback"><div class="eyebrow" style="margin-bottom:6px">Model answer</div><div>${esc(c[3])}</div></div>${st.typed?`<div><div class="small muted" style="margin-bottom:4px">Key terms you used (${st.check.hits.length}/${st.check.keys.length}):</div>${kwHTML(st.check)}</div>`:''}
        <p class="small muted">${st.check.ratio>=.5?'Looks like you got the main ideas.':'You may have missed some key ideas.'} Be honest: did you know it?</p>
        <div class="row" style="justify-content:flex-end"><button class="btn" data-self="0">Not yet</button><button class="btn primary" data-self="1">I knew it</button></div>`}</div>`;
    }
    m.innerHTML = studyShell(set.title + ' · Learn', set.s||t.s, st.doneSteps/st.total*100, inner, `${items.filter(i=>i.stage===2).length}/${items.length}`);
    quitHandler(m);
    on(m,'[data-o]','click',e=>{ st.answered = +e.currentTarget.dataset.o; const ok = st.opts[st.answered][0]===c[0]; if(ok){ st.cur.stage=1; st.doneSteps++; } else { st.cur.wrongs++; recordResult(c[0], false); } o.render(m); });
    on(m,'#next','click',()=>{ st.q.splice(Math.min(st.q.length, st.cur.stage===0?2:st.q.length), 0, st.cur); nextQ(); o.render(m); });
    on(m,'#typed','input',e=>{ st.typed = e.target.value; });
    on(m,'#checkBtn','click',()=>{ st.check = checkTyped(st.typed, c[3]); o.render(m); });
    on(m,'#dunno','click',()=>{ st.typed=''; st.check = checkTyped('', c[3]); o.render(m); });
    on(m,'[data-self]','click',e=>{ const ok = e.currentTarget.dataset.self==='1'; if (ok) { st.cur.stage=2; st.doneSteps++; recordResult(c[0], st.cur.wrongs===0); nextQ(); } else { st.cur.wrongs++; recordResult(c[0], false); st.cur.stage=0; st.doneSteps--; st.q.splice(Math.min(st.q.length,2),0,st.cur); nextQ(); } o.render(m); });
    m.querySelector('#typed')?.focus();
  }, key(e,m){ if (st.cur && st.cur.stage===0 && st.answered==null && '1234'.includes(e.key) && !e.target.closest('textarea,input')) m.querySelector(`[data-o="${+e.key-1}"]`)?.click(); else if (e.key==='Enter' && !e.target.closest('textarea')) m.querySelector('#next')?.click(); } };
  return o;
}

// Write
function modeWrite(set, taskKey){
  const order = priorityCards(set.ids, Math.min(set.ids.length, 12));
  const st = { i:0, typed:'', check:null, right:0 };
  const o = { render(m){
    if (st.i >= order.length) { markDone(taskKey); m.innerHTML = summaryCard('Write complete', `${st.right}/${order.length}`, 'answered correctly from memory', set.s, true); on(m,'#done','click',endStudy); on(m,'#again','click',()=>{ STUDY = modeWrite(set, taskKey); render(); }); return; }
    const c = CARD[order[st.i]]; const t = TOPIC[c[1]];
    m.innerHTML = studyShell(set.title + ' · Write', set.s||t.s, st.i/order.length*100, `<div class="qbox stack"><span class="pill subj s-${t.s}" style="align-self:flex-start">${esc(t.name)}</span><div class="prompt">${esc(c[2])}</div>
      ${st.check==null?`<textarea id="typed" placeholder="Type your answer…">${esc(st.typed)}</textarea><div class="row between"><span class="tiny faint">Ctrl/⌘ + Enter to check</span><button class="btn primary" id="checkBtn">Check</button></div>`:
      `<div class="feedback"><div class="eyebrow" style="margin-bottom:6px">Model answer</div>${esc(c[3])}</div>
       ${st.typed.trim() ? `<div class="feedback ${st.check.ratio>=.5?'ok':'warn'}"><div class="eyebrow" style="margin-bottom:6px">${st.check.ratio>=.5?'Good coverage':'Compare with the model answer'} · ${st.check.hits.length}/${st.check.keys.length} key terms used</div>${kwHTML(st.check)}${st.check.ratio<.5?'<div class="small" style="margin-top:6px">Your own wording can still be right. Decide below.</div>':''}</div>` : ''}
       <p class="small muted">Did your answer say the same thing?</p>
       <div class="row" style="justify-content:flex-end"><button class="btn" data-self="0">I was wrong</button><button class="btn primary" data-self="1">I was right</button></div>`}</div>`, `${st.i+1}/${order.length}`);
    quitHandler(m);
    on(m,'#typed','input',e=>{ st.typed = e.target.value; });
    on(m,'#typed','keydown',e=>{ if (e.key==='Enter' && (e.ctrlKey||e.metaKey)) m.querySelector('#checkBtn').click(); });
    on(m,'#checkBtn','click',()=>{ st.check = checkTyped(st.typed, c[3]); o.render(m); });
    on(m,'[data-self]','click',e=>{ const ok = e.currentTarget.dataset.self==='1'; if (ok) st.right++; recordResult(c[0], ok); st.i++; st.typed=''; st.check=null; o.render(m); });
    m.querySelector('#typed')?.focus();
  }};
  return o;
}

// Match
function modeMatch(set, taskKey){
  const key = set.topic || set.title;
  const pick = shuffle(set.ids).slice(0, Math.min(window.innerWidth <= 560 ? 4 : 6, set.ids.length));
  const tiles = shuffle(pick.flatMap(id=>[{ id, kind:'t', text: CARD[id][2] }, { id, kind:'a', text: brief(CARD[id][3], 110) }]));
  const st = { sel:null, gone:new Set(), start: Date.now(), pen:0, bad:null, finished:null, timer:null };
  const o = { render(m){
    if (st.finished) { clearInterval(st.timer); const best = S.match[key]; m.innerHTML = summaryCard('Matched', st.finished.toFixed(1)+'s', best && best < st.finished ? `Your best is ${best.toFixed(1)}s` : 'New personal best', set.s, true); on(m,'#done','click',endStudy); on(m,'#again','click',()=>{ STUDY = modeMatch(set, taskKey); render(); }); return; }
    m.innerHTML = studyShell(set.title + ' · Match', set.s, st.gone.size/tiles.length*100, `<p class="small muted">Tap a term, then its answer. Wrong pairs add 1 second.</p><div class="match-grid">${tiles.map((x,i)=>`<button class="tile ${x.kind==='t'?'term-t':''} ${st.sel===i?'sel':''} ${st.gone.has(i)?'gone':''} ${st.bad&&st.bad.includes(i)?'bad':''}" data-t="${i}">${esc(x.text)}</button>`).join('')}</div>`, `<span id="mt">0.0</span>s`);
    quitHandler(m);
    const mt = m.querySelector('#mt'); clearInterval(st.timer); st.timer = setInterval(()=>{ if (!document.body.contains(mt)) { clearInterval(st.timer); return; } mt.textContent = ((Date.now()-st.start)/1000 + st.pen).toFixed(1); }, 100);
    on(m,'[data-t]','click',e=>{ const i = +e.currentTarget.dataset.t; st.bad = null;
      if (st.sel == null) { st.sel = i; }
      else if (st.sel === i) { st.sel = null; }
      else { const a = tiles[st.sel], b = tiles[i];
        if (a.id === b.id && a.kind !== b.kind) { st.gone.add(st.sel); st.gone.add(i); st.sel = null; recordResult(a.id, true);
          if (st.gone.size === tiles.length) { st.finished = (Date.now()-st.start)/1000 + st.pen; S.match[key] = S.match[key] ? Math.min(S.match[key], st.finished) : st.finished; markDone(taskKey); save(); } }
        else { st.bad = [st.sel, i]; st.pen += 1; st.sel = null; } }
      o.render(m); });
  }};
  return o;
}

// Test
function modeTest(set, taskKey){
  const st = { phase:'setup', n: Math.min(10, set.ids.length), types:{mcq:true, tf:true, written:true}, qs:[], ans:{}, self:{}, score:null };
  const build = () => { const ids = priorityCards(set.ids, st.n); const kinds = Object.keys(st.types).filter(k=>st.types[k]); st.qs = ids.map((id,i)=>{ const kind = kinds[i % kinds.length]; const c = CARD[id];
    if (kind==='mcq') return { kind, id, opts: shuffle([c, ...distractors(c)]) };
    if (kind==='tf') { const truth = Math.random() < .5; const other = truth ? c : distractors(c,1)[0] || c; return { kind, id, shown: brief(other[3], 220), truth: other[0]===c[0] }; }
    return { kind, id }; }); st.qs = shuffle(st.qs); };
  const o = { render(m){
    if (st.phase==='setup') {
      m.innerHTML = studyShell(set.title + ' · Test', set.s, 0, `<div class="qbox card pad-lg stack"><h2>Set up your test</h2>
        <div><div class="small muted" style="margin-bottom:6px">Questions</div><div class="seg">${[5,10,20,30].filter(n=>n<=Math.max(5,set.ids.length)).map(n=>`<button aria-pressed="${st.n===Math.min(n,set.ids.length)}" data-n="${n}">${n}</button>`).join('')}</div></div>
        <div><div class="small muted" style="margin-bottom:6px">Question types</div><div class="row">${[['mcq','Multiple choice'],['tf','True / false'],['written','Written']].map(([k,l])=>`<label class="row small" style="gap:6px"><input type="checkbox" data-type="${k}" ${st.types[k]?'checked':''}> ${l}</label>`).join('')}</div></div>
        <button class="btn primary" id="go" style="align-self:flex-start">Start test</button></div>`, '');
      quitHandler(m);
      on(m,'[data-n]','click',e=>{ st.n = Math.min(+e.currentTarget.dataset.n, set.ids.length); o.render(m); });
      on(m,'[data-type]','change',e=>{ st.types[e.target.dataset.type] = e.target.checked; if (!Object.values(st.types).some(Boolean)) { st.types.mcq = true; o.render(m); } });
      on(m,'#go','click',()=>{ build(); st.phase='run'; o.render(m); window.scrollTo(0,0); });
      return;
    }
    const answered = st.qs.filter((q,i)=>st.ans[i]!=null && st.ans[i]!=='').length;
    const marked = st.phase==='results';
    const qHTML = st.qs.map((q,i)=>{ const c = CARD[q.id]; const t = TOPIC[c[1]]; const a = st.ans[i];
      let body = '';
      if (q.kind==='mcq') body = `<div class="stack" style="gap:8px">${q.opts.map((x,j)=>{ let cl = a===j ? 'sel' : ''; if (marked) { if (x[0]===c[0]) cl='right'; else if (a===j) cl='wrong'; } return `<button class="opt ${cl}" data-q="${i}" data-a="${j}" ${marked?'disabled':''} style="${a===j&&!marked?'border-color:var(--accent);background:var(--accent-soft)':''}">${esc(brief(x[3],200))}${marked && a===j && x[0]!==c[0] ? `<div class="tiny" style="margin-top:4px">This describes: ${esc(x[2])}</div>` : ''}</button>`; }).join('')}</div>`;
      else if (q.kind==='tf') body = `<div class="feedback small">${esc(q.shown)}</div><div class="row">${[['true','True'],['false','False']].map(([v,l])=>{ const sel = a===v; let style = sel && !marked ? 'border-color:var(--accent);background:var(--accent-soft)' : ''; let cl=''; if (marked) { const right = (v==='true')===q.truth; if (right) cl='right'; else if (sel) cl='wrong'; } return `<button class="opt ${cl}" style="width:auto;flex:1;text-align:center;${style}" data-q="${i}" data-a="${v}" ${marked?'disabled':''}>${l}</button>`; }).join('')}</div>`;
      else body = marked ? `<div class="feedback"><div class="eyebrow" style="margin-bottom:4px">Your answer</div>${esc(a||'(blank)')}</div><div class="feedback ok"><div class="eyebrow" style="margin-bottom:4px">Model answer</div>${esc(c[3])}</div>${st.self[i]==null?`<div class="row" style="justify-content:flex-end"><button class="btn sm" data-selfq="${i}" data-v="0">I was wrong</button><button class="btn sm primary" data-selfq="${i}" data-v="1">I was right</button></div>`:`<span class="pill ${st.self[i]?'good':'bad'}">${st.self[i]?'Marked right':'Marked wrong'}</span>`}` : `<textarea data-w="${i}" placeholder="Your answer…" style="min-height:90px">${esc(a||'')}</textarea>`;
      const prompt = q.kind==='tf' ? `Does this match “${esc(c[2])}”?` : esc(c[2]);
      return `<section class="card stack" style="gap:10px"><div class="row between"><span class="tiny muted mono">Q${i+1} · ${q.kind==='mcq'?'Multiple choice':q.kind==='tf'?'True or false':'Written'}</span><span class="pill subj s-${t.s}">${esc(t.name)}</span></div><div style="font-weight:600;font-size:1.02rem">${prompt}</div>${body}</section>`; }).join('');
    let head = '';
    if (marked) { const auto = st.qs.map((q,i)=>q.kind==='written' ? st.self[i] : q.kind==='mcq' ? q.opts[st.ans[i]]?.[0]===q.id : st.ans[i]!=null && ((st.ans[i]==='true')===q.truth));
      const right = auto.filter(x=>x===true).length; const pending = auto.filter(x=>x==null).length;
      head = `<div class="card pad-lg row between"><div><div class="eyebrow">Your score</div><div class="result-big mono">${Math.round(right/st.qs.length*100)}%</div><p class="small muted">${right} of ${st.qs.length} correct${pending?` · mark ${pending} written answer${pending>1?'s':''} below`:''}</p></div><div class="row"><button class="btn" id="done">Done</button><button class="btn primary" id="retake">New test</button></div></div>`; }
    m.innerHTML = studyShell(set.title + ' · Test', set.s, marked?100:answered/st.qs.length*100, `${head}<div class="qbox stack">${qHTML}${marked?'':`<button class="btn primary" id="submit" style="align-self:flex-end">Submit test</button>`}</div>`, `${answered}/${st.qs.length}`);
    quitHandler(m);
    on(m,'[data-q]','click',e=>{ const i = +e.currentTarget.dataset.q; const v = e.currentTarget.dataset.a; st.ans[i] = st.qs[i].kind==='mcq' ? +v : v; const y = window.scrollY; o.render(m); window.scrollTo(0,y); });
    on(m,'[data-w]','input',e=>{ st.ans[+e.target.dataset.w] = e.target.value; });
    on(m,'#submit','click',()=>{ st.phase='results'; st.qs.forEach((q,i)=>{ if (q.kind==='mcq') recordResult(q.id, q.opts[st.ans[i]]?.[0]===q.id); else if (q.kind==='tf') recordResult(q.id, st.ans[i]!=null && ((st.ans[i]==='true')===q.truth)); }); markDone(taskKey); o.render(m); window.scrollTo(0,0); });
    on(m,'[data-selfq]','click',e=>{ const i = +e.currentTarget.dataset.selfq; const ok = e.currentTarget.dataset.v==='1'; st.self[i] = ok; recordResult(st.qs[i].id, ok); const y = window.scrollY; o.render(m); window.scrollTo(0,y); });
    on(m,'#done','click',endStudy);
    on(m,'#retake','click',()=>{ STUDY = modeTest(set, taskKey); render(); });
  }};
  return o;
}

  if (!sj.custom) { const sp = PP_SPECS['builtin|'+s]; const board = sj.board.split(' ')[0] === 'Edexcel' ? 'Pearson Edexcel' : sj.board.split(' ')[0]; return { s, name: sj.name, board, code: sp.code, papers: sp.papers, url: sp.url || PP_FINDER[board], known:true }; }
  const c = courseOf(s); const board = boardBase(c); const p = c.pack && packInfo(c.pack);
  const names = [c.name, ...(p ? p.names : [])].map(normName);
  const spk = c.pack && PP_SPECS['pack|'+c.pack]; if (spk) return { s, name: c.name, board, code: spk.code, papers: spk.papers, url: PP_FINDER[board], known:true };
  for (const n of names) { const sp = PP_SPECS[board+'|'+n]; if (sp) return { s, name: c.name, board, code: sp.code, papers: sp.papers, url: PP_FINDER[board], known:true }; }
  const labels = (c.exams||[]).map(e=>e.label).filter(Boolean);
  return { s, name: c.name, board, code: c.code || '', papers: (labels.length ? labels : ['Paper 1','Paper 2','Paper 3']).map(l=>P(l,'',120,0)), url: PP_FINDER[board] || 'https://www.google.com/search?q=' + encodeURIComponent(`${board && board!=='Other' ? board+' ' : ''}A level ${c.name} past papers and mark schemes`), known:false };
}
const ppKey = (s, y, i) => `${s}|${y}|${i}`;
const ppAttempts = (k) => ((S.pp||{})[k] || []).filter(a => !a.del);
function ppAll(s){ return Object.entries(S.pp||{}).filter(([k]) => k.startsWith(s+'|')).flatMap(([k, arr]) => arr.filter(a=>!a.del).map(a => ({...a, k}))).sort((a,b)=>a.at-b.at); }

function bindPanel(m, info, sel){

  on(m,'#ppExtra','change',e=>{ S.settings.extraTime = e.target.checked; save(); });
  on(m,'#ppTime','click',()=>{ draft(); STUDY = modePastTimer(info, sel); window.scrollTo(0,0); render(); });

    if (PP_DRAFT.score === '' || !(mx > 0)) { toast('Enter your marks and the total'); return; }

function modePastTimer(info, sel){

  const used = () => st.used + (st.paused ? 0 : (Date.now() - st.from) / 1000);
  const fmt = (sec) => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec/3600), mm = Math.floor(sec%3600/60), ss = sec%60; return (h ? h+':'+String(mm).padStart(2,'0') : mm) + ':' + String(ss).padStart(2,'0'); };
  const finish = () => { clearInterval(st.timer); st.done = true; const mins = Math.round(used()/60); PP_SEL = sel; PP_DRAFT = Object.assign(PP_DRAFT || {}, { mins }); STUDY = null; VIEW = 'papers'; if (location.hash !== '#papers') history.replaceState(null, '', '#papers'); render(); setTimeout(()=>document.getElementById('ppPanel')?.scrollIntoView({block:'start'}), 50); toast(`Time recorded: ${fmtMins(mins)}. Now mark it.`); };
  const o = { leaveMsg: 'Stop the timer and leave this paper?', guard: () => !st.done && used() > 30, render(m){
    m.innerHTML = studyShell(ppTitle(info, sel), sel.s, 0, `<section class="card pad-lg stack" style="align-items:center;text-align:center;gap:14px">
        <div class="eyebrow">Time left</div><div class="mono pp-clock" id="ppLeft">${fmt(total - used())}</div>
        <div class="small muted" id="ppUsed">${fmt(used())} used of ${fmt(total)}${S.settings.extraTime ? ' (with 25% extra time)' : ''}</div>
        <div class="row" style="justify-content:center"><button class="btn" id="ppPause">${st.paused ? 'Resume' : 'Pause'}</button><button class="btn primary" id="ppDone">I've finished</button></div>
        <p class="tiny muted" style="max-width:46ch">Work on the printed paper or on lined paper. Keep this screen open. When time's up, finish the sentence you're on and stop, just like the real exam.</p></section>`, '');
    on(m,'#quit','click',()=>{ if (!leaveOK()) return; clearInterval(st.timer); st.done = true; STUDY = null; render(); });
    on(m,'#ppPause','click',()=>{ if (st.paused) { st.from = Date.now(); st.paused = false; } else { st.used = used(); st.paused = true; } o.render(m); });
    on(m,'#ppDone','click',finish);
    clearInterval(st.timer); st.timer = setInterval(()=>{ const l = document.getElementById('ppLeft'); if (!l || STUDY !== o) { clearInterval(st.timer); return; } const left = total - used(); l.textContent = left >= 0 ? fmt(left) : '-' + fmt(-left); l.style.color = left < 0 ? 'var(--bad)' : left < 600 ? 'var(--warn)' : ''; const u = document.getElementById('ppUsed'); if (u) u.textContent = `${fmt(used())} used of ${fmt(total)}${S.settings.extraTime ? ' (with 25% extra time)' : ''}`; if (left <= 0 && !st.beeped) { st.beeped = true; toast("Time's up. Pens down."); try { navigator.vibrate && navigator.vibrate([300,150,300]); } catch(_){} } }, 1000);
  }};
  return o;
}

function parseNum(s){
  s = String(s).trim().replace(/[−–]/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'').replace(/^[a-zθ]\s*=\s*/i,'').replace(/\s+/g,'').replace(/°$/,'');

    if (st.i >= st.n) { markDone(taskKey); m.innerHTML = summaryCard('Drill complete', `${st.right}/${st.n}`, 'correct', 'maths', true); on(m,'#done','click',endStudy); on(m,'#again','click',()=>{ STUDY = modeDrill(tid, taskKey); render(); }); return; }
    const q = st.cur;
    m.innerHTML = studyShell(`Drill · ${tid==='mixed'?'Mixed':tid==='mock'?mockCfg().title:TOPIC[tid].name}`, 'maths', st.i/st.n*100, `<div class="qbox stack"><span class="pill subj s-maths" style="align-self:flex-start">${esc(TOPIC[q.t].name)}</span><div class="prompt" style="font-family:var(--f-body);font-weight:600;font-size:1.15rem">${esc(q.q)}</div>
      <div class="row" style="flex-wrap:nowrap"><input type="text" inputmode="decimal" id="val" placeholder="Your answer" value="${esc(st.val)}" ${st.res?'disabled':''} autocomplete="off"><button class="btn primary" id="chk" ${st.res?'hidden':''}>Check</button></div>
      ${st.res?`<div class="feedback ${st.res.ok?'ok':'no'}"><b>${st.res.ok?'Correct.':'Not this time.'}</b> Answer: <span class="mono">${esc(fmt(q.ans, q.dp))}</span><div class="small" style="margin-top:6px">${esc(q.sol)}</div></div><button class="btn primary" id="nx" style="align-self:flex-end">Next</button>`:'<button class="btn ghost sm" id="reveal" style="align-self:flex-start">Show solution</button>'}</div>`, `${st.i+1}/${st.n}`);
    quitHandler(m);
    const inp = m.querySelector('#val'); if (inp && !st.res) inp.focus();
    on(m,'#val','input',e=>{ st.val = e.target.value; });
    on(m,'#val','keydown',e=>{ if (e.key==='Enter') { e.preventDefault(); m.querySelector('#chk')?.click(); } });
    const finish = (ok) => { st.res = { ok }; if (ok) st.right++; const d = S.drills[q.t] ||= { r:0, n:0, at:0 }; d.n++; if (ok) d.r++; d.at = Date.now(); today().d++; save(); o.render(m); m.querySelector('#nx')?.focus(); };
    on(m,'#chk','click',()=>{ const x = parseNum(st.val); if (!isFinite(x)) { toast('Enter a number, e.g. 2.35, 7/4, 2√3 or 3π'); return; } finish(closeEnough(x, q.ans, q.dp)); });
    on(m,'#reveal','click',()=>finish(false));
    on(m,'#nx','click',()=>{ st.i++; gen(); o.render(m); });
  }};
  return o;
}

        <div id="resetBox" hidden class="feedback no row between"><span class="small">This deletes all card progress and exam marks on every device. It cannot be undone.</span><button class="btn sm" id="doReset">Yes, reset everything</button></div></div>
    </section>
    <section class="card stack"><h3>About the content</h3><p class="small muted">Cards follow the current specifications: AQA A-level Psychology 7182 (updated for first A-level exams in 2027: Clinical Psychology and Mental Health replaces Psychopathology, and content AQA removed, such as Schaffer's stages, the role of the father, Wundt and biological rhythms, is no longer included; built-in cards for the options Relationships, Schizophrenia and Forensic Psychology, and you make cards for any other options with Claude), Pearson Edexcel A-level Mathematics 9MA0 (Issue 4, large data set: Met Office weather 1987 and 2015), and Pearson Edexcel A-level Economics A 9EC0 (Issue 2). Ready-made subjects were checked against each board's current specification in November 2026; where a board has a new specification (AQA Business 7138, first exams 2028), both versions are offered and the right one is picked from your exam year. Exam questions are original practice questions in the style of each board, not past-paper questions. Check anything surprising against your class notes and the official specification.</p></section>
  </div>`;
  on(m,'[data-learn]','click',e=>startMode('learn', setFromTopic(e.currentTarget.dataset.learn)));
  on(m,'[data-mysub]','change',e=>{ const a = new Set(mySubj()); e.target.checked ? a.add(e.target.dataset.mysub) : a.delete(e.target.dataset.mysub); if (!a.size) { e.target.checked = true; toast('Keep at least one course'); return; } S.settings.subjects = ALL_SUBJ.filter(x=>a.has(x)); save(); render(); });
  on(m,'#setName','change',e=>{ S.settings.name = e.target.value.trim(); save(); });
  on(m,'[data-tsz]','click',e=>{ S.settings.textSize = e.currentTarget.dataset.tsz; save(); render(); });
  on(m,'[data-syear]','click',e=>{ S.settings.examYear = +e.currentTarget.dataset.syear; CUSTOM_SIG = null; save(); render(); toast(`Exams set to summer ${S.settings.examYear}`); });
  bindPsychOpts(m, ()=>{ render(); toast('Paper 3 options saved'); });
  const mockSave = () => { S.settings.mock = Object.assign({}, mockCfg(), S.settings.mock || {}); save(); renderNav(); };
  on(m,'#mockTitle','change',e=>{ mockSave(); S.settings.mock.title = e.target.value.trim() || 'Mocks'; save(); });
  on(m,'#mockDate','change',e=>{ mockSave(); S.settings.mock.date = e.target.value || ''; save(); render(); toast(e.target.value ? 'Mock date saved' : 'Focus mode off'); });
  on(m,'[data-mtopic]','change',e=>{ mockSave(); const id = e.target.dataset.mtopic; const ts = new Set(S.settings.mock.topics); e.target.checked ? ts.add(id) : ts.delete(id); S.settings.mock.topics = TOPICS.map(t=>t.id).filter(x=>ts.has(x)); save(); });
  on(m,'#setGoal','change',e=>{ S.settings.goal = Math.max(10, Math.min(400, +e.target.value || 60)); save(); renderNav(); });
  on(m,'[data-grade]','change',e=>{ S.settings.grades[e.target.dataset.grade][+e.target.dataset.i] = e.target.value; save(); });
  on(m,'#copyBk','click',async ()=>{ const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); try { await navigator.clipboard.writeText(code); toast('Backup code copied'); } catch(e){ const b = m.querySelector('#impBox'); b.hidden = false; const ta = m.querySelector('#impTxt'); ta.value = code; ta.select(); toast('Select all and copy the code'); } });
  on(m,'#showImp','click',()=>{ m.querySelector('#impBox').hidden = false; });
  on(m,'#doImp','click',()=>{ try { const o = JSON.parse(decodeURIComponent(escape(atob(m.querySelector('#impTxt').value.trim())))); if (!o || !o.cards) throw 0; S = mergeState(S, o); save(); toast('Progress restored'); render(); } catch(e){ toast('That code is not valid. Copy it again in full.'); } });
  on(m,'#saveKey','click',()=>{ const v = m.querySelector('#apiKey').value.trim(); if (!/^sk-ant-/.test(v)) { toast('That does not look like an Anthropic API key'); return; } setKey(v); toast('Key saved on this device'); render(); });
  on(m,'#clearKey','click',()=>{ setKey(''); toast('Key removed'); render(); });
  bindAccount(m);
  on(m,'#ghOn','click',async ()=>{ const v = m.querySelector('#ghTok').value.trim(); if (!/^(ghp_|github_pat_|gho_)/.test(v)) { toast('That does not look like a GitHub token'); return; } ghSet({ token:v, gist:null }); toast('Connecting…'); await initGhSync(); if (SYNC.gh) { toast('Sync is on'); } else { ghSet(null); toast('GitHub did not accept that token. Check it and try again.'); } render(); });
  on(m,'#ghNow','click',async ()=>{ if (!SYNC.gh) await initGhSync(); else { setSync('warn','Syncing…'); try { await ghPush(); setSync('ok','Synced'); toast('Synced'); } catch(e){ setSync('warn','Sync retrying'); toast('Could not reach GitHub just now'); } } render(); });
  on(m,'#ghOff','click',()=>{ ghSet(null); SYNC.gh = false; setSync('local','Saved on this device'); toast('Sync turned off on this device'); render(); });
  on(m,'#reset','click',()=>{ m.querySelector('#resetBox').hidden = false; });
  on(m,'#doReset','click',()=>{ const keep = S.settings; SYNC.overwrite = true; S = blank(); S.settings = keep; save(); toast('Progress reset'); render(); });
}

// ---------- boot ----------
document.addEventListener('keydown', e => { if (STUDY && STUDY.key) STUDY.key(e, document.getElementById('main')); if (e.key==='Escape' && STUDY) endStudy(); });
async function boot(){
  loadLocal();
  const h = location.hash.slice(1); VIEW = NAV.some(n=>n[0]===h) ? h : 'home';
  renderNav();
  try {
    const res = await fetch('content.json'); const data = await res.json();
    CARDS = data.cards; EXAMQ = data.exam; LIB = data.lib || [];
    CARDS.forEach(c => { CARD[c[0]] = c; (BYTOPIC[c[1]] ||= []).push(c[0]); });
    CUSTOM_SIG = null;
  } catch(e) { document.getElementById('main').innerHTML = '<div class="empty">The revision content could not load. Check your connection and reload the page.</div>'; return; }
  render();
  initSync(); initSample();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
